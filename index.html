<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- O'YIN QISMI -->
    <section class="game-area">

      <div class="game-table">

        <div class="table-decoration"></div>

        <div class="bottle" id="bottle">
          🍾
        </div>

        <!-- O'yinchilar shu yerga JS orqali chiqadi -->
        <div id="players"></div>

      </div>

      <div class="controls">
        <button id="spinButton">AYLANTIRISH</button>
        <button id="addPlayerButton">+ O'YINCHI</button>
      </div>

    </section>


    <!-- CHAT QISMI -->
    <section class="chat-area">

      <div class="chat-header">
        <span>Chat</span>
        <span id="playerCount">0 o'yinchi</span>
      </div>

      <div class="messages" id="messages"></div>

      <form class="chat-form" id="chatForm">
        <input
          type="text"
          id="chatInput"
          placeholder="Xabar yozing..."
          autocomplete="off"
        >
        <button type="submit">➤</button>
      </form>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
