<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin the Bottle - Opposite Gender Logic</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;
}
body{
    background:#120c08;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game-container{
    width:100%;
    max-width:414px;
    height:100vh;
    max-height:896px;
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,220,166,.25) 0%,
            rgba(222,172,111,.12) 38%,
            rgba(151,91,45,.05) 65%,
            transparent 88%
        ),
        repeating-linear-gradient(
            7deg,
            rgba(91,49,20,.04) 0px,
            rgba(91,49,20,.04) 2px,
            transparent 2px,
            transparent 14px
        ),
        linear-gradient(
            145deg,
            #c8965c 0%,
            #b27a43 28%,
            #a36833 55%,
            #875126 78%,
            #613615 100%
        );
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    border-radius:32px;
    color:#fff;
    border:1px solid rgba(255,220,170,.15);
    box-shadow:0 25px 55px rgba(0,0,0,.75);
}

.header-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px 10px;
    font-size:16px;
    font-weight:600;
    color:#e0c3a8;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(8px);
    position:relative;
    z-index:10;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:15px;
    font-weight:700;
    color:#f5e5d3;
    letter-spacing:0.5px;
}

.stats-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px 12px;
    background:rgba(0,0,0,.15);
    position:relative;
    z-index:10;
}

.heart-badge{
    background:linear-gradient(135deg, #a33232, #751d1d);
    padding:5px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:12px;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
}

.stat-item{
    font-size:11px;
    font-weight:600;
    color:#d9c0a7;
    background:rgba(255,255,255,.08);
    padding:5px 10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
}

.table-area{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

.rope-medallion{
    width:230px;
    height:230px;
    position:absolute;
    pointer-events:none;
    transition: filter 0.5s ease;
}

.table-area.spinning .rope-medallion {
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
}

.bottle{
    width:34px;
    height:109px;
    position:absolute;
    left:calc(50% - 17px);
    top:calc(50% - 54.5px);
    transform-origin:50% 50%;
    transform:rotate(0deg);
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
    z-index:20;
    transition:transform 3.2s cubic-bezier(.1,.85,.15,1);
    cursor:pointer;
}

.bottle:active {
    transform: scale(0.97);
}

.players-container{
    width:340px;
    height:340px;
    position:relative;
    z-index:10;
}

.player{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    border:2px solid #b59247;
    z-index:10;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    cursor:pointer;
}

.player.is-me {
    border-color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

.player:active {
    transform: scale(0.92) !important;
}

.player.winner{
    animation: winnerGlow 1.2s ease-in-out infinite alternate;
    z-index:25;
}

@keyframes winnerGlow{
    0% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 0 10px rgba(181, 146, 71, 0.5); }
    100% { box-shadow: 0 0 0 3.5px rgba(255, 255, 255, 0.9), 0 0 18px rgba(181, 146, 71, 0.8); }
}

.player-name-box {
    position:absolute;
    bottom:-18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:3px;
    background:rgba(18, 12, 8, 0.92);
    padding:2px 6px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.12);
    white-space:nowrap;
    z-index:15;
    max-width: 68px;
}

.player-flag {
    font-size:8.5px;
    line-height:1;
    opacity:0.9;
    flex-shrink: 0;
}

.player-name{
    font-size:9px;
    font-weight:600;
    color:#e5d5c5;
    max-width:45px;
    overflow:hidden;
    white-space:nowrap;
    line-height:1.1;
    text-overflow: clip;
    -webkit-mask-image: linear-gradient(to right, #000 70%, transparent 100%);
    mask-image: linear-gradient(to right, #000 70%, transparent 100%);
}

.chat-section{
    background:#16100c;
    color:#fff;
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    height:280px;
    display:flex;
    flex-direction:column;
    padding:16px 18px;
    border-top:1px solid rgba(255,255,255,.08);
    z-index:30;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-weight:600;
    font-size:12px;
    color:rgba(255,255,255,.4);
    letter-spacing:0.5px;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px 0;
}

.chat-item{ display:flex; align-items:flex-start; gap:10px; }

.chat-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    background-size:cover;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,.15);
}

.chat-username{
    font-weight:600;
    font-size:11px;
    color:rgba(255,255,255,.45);
    margin-bottom:2px;
}

.chat-bubble{
    background:rgba(255,255,255,.04);
    padding:8px 12px;
    border-radius:4px 12px 12px 12px;
    font-size:12px;
    color:#d9c8b7;
    border:1px solid rgba(255,255,255,.04);
    line-height:1.3;
}

.chat-input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding-top:8px;
}

.chat-input{
    flex:1;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 16px;
    border-radius:20px;
    outline:none;
    font-size:12px;
    color:#fff;
}

.chat-input::placeholder{ color:rgba(255,255,255,.25); }

.send-btn{
    background:#a87b47;
    color:#120c08;
    border:none;
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
    transition:transform 0.1s ease;
}

.send-btn:active {
    transform: scale(0.9);
}

.modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.flag-modal {
    background: #1c140e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 18px;
    width: 280px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

.flag-modal h3 {
    font-size: 13px;
    color: #e5d5c5;
    margin-bottom: 12px;
}

.flag-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.flag-option {
    font-size: 18px;
    padding: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.2s, border 0.2s;
}

.flag-option:hover {
    background: rgba(255,255,255,0.15);
    border-color: #a87b47;
}

.close-modal-btn {
    background: rgba(255,255,255,0.1);
    color: #aaa;
    border: none;
    padding: 6px 16px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="game-container">

    <div class="header-nav">
        <span style="cursor:pointer;">✕</span>
        <div class="header-title">Spin the Bottle</div>
        <span style="cursor:pointer;">⋮</span>
    </div>

    <div class="stats-bar">
        <div class="heart-badge">❤️ 10,000</div>
        <div class="stat-item">🎟️ 8</div>
        <div class="stat-item">GLOBAL #229</div>
    </div>

    <div class="table-area" id="tableArea">
        <svg class="rope-medallion" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
            <circle cx="120" cy="120" r="46" fill="rgba(0,0,0,.05)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
        </svg>

        <svg class="bottle" id="bottle" onclick="spinBottle()" viewBox="0 0 100 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#021206"/>
                    <stop offset="25%" stop-color="#0b3814"/>
                    <stop offset="50%" stop-color="#236e30"/>
                    <stop offset="75%" stop-color="#0b3814"/>
                    <stop offset="100%" stop-color="#021206"/>
                </linearGradient>

                <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#9e8352"/>
                    <stop offset="50%" stop-color="#d1be94"/>
                    <stop offset="100%" stop-color="#9e8352"/>
                </linearGradient>
            </defs>

            <path fill="url(#glassGrad)" fill-opacity="0.96" d="M32,0 L68,0 L68,14 Q69,16 69,20 L69,64 Q69,86 82,100 Q96,116 96,140 L96,292 Q96,306 79,310 Q65,314 50,314 Q35,314 21,310 Q4,306 4,292 L4,140 Q4,116 18,100 Q31,86 31,64 L31,20 Q31,16 32,14 Z" />
            
            <rect x="14" y="150" width="72" height="135" rx="4" fill="url(#labelGrad)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
            
            <text x="50" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#2d1c07" letter-spacing="1">SPIN THE</text>
            <text x="50" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#2d1c07" letter-spacing="1.2">BOTTLE</text>
            
            <ellipse cx="26" cy="60" rx="3" ry="28" fill="rgba(255,255,255,0.15)"/>
        </svg>

        <div class="players-container" id="playersContainer"></div>
    </div>

    <div class="chat-section">
        <div class="chat-header">GLOBAL CHAT</div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=1');"></div>
                <div>
                    <div class="chat-username">Elena 🇺🇸</div>
                    <div class="chat-bubble">Hello everyone! 👋</div>
                </div>
            </div>
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=12');"></div>
                <div>
                    <div class="chat-username">Lucas 🇩🇪</div>
                    <div class="chat-bubble">Ready for the spin? 🔥</div>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input id="chatInput" type="text" class="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage();">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="modal-overlay" id="flagModal">
        <div class="flag-modal">
            <h3>Bayroqni tanlang</h3>
            <div class="flag-grid">
                <span class="flag-option" onclick="selectFlag('🇺🇿')">🇺🇿</span>
                <span class="flag-option" onclick="selectFlag('🇺🇸')">🇺🇸</span>
                <span class="flag-option" onclick="selectFlag('🇬🇧')">🇬🇧</span>
                <span class="flag-option" onclick="selectFlag('🇩🇪')">🇩🇪</span>
                <span class="flag-option" onclick="selectFlag('🇫🇷')">🇫🇷</span>
                <span class="flag-option" onclick="selectFlag('🇹🇷')">🇹🇷</span>
                <span class="flag-option" onclick="selectFlag('🇷🇺')">🇷🇺</span>
                <span class="flag-option" onclick="selectFlag('🇰🇷')">🇰🇷</span>
                <span class="flag-option" onclick="selectFlag('🇯🇵')">🇯🇵</span>
                <span class="flag-option" onclick="selectFlag('🇦🇪')">🇦🇪</span>
                <span class="flag-option" onclick="selectFlag('🇪🇸')">🇪🇸</span>
                <span class="flag-option" onclick="selectFlag('🇧🇷')">🇧🇷</span>
            </div>
            <button class="close-modal-btn" onclick="closeFlagModal()">Yopish</button>
        </div>
    </div>

</div>

<script>
// Har bir o'yinchiga gender (jinsi) qo'shildi: 'male' yoki 'female'
const players = [
    { id: 1, name:"Muhammadali", gender:"male", flag:"🇺🇿", img:"https://i.pravatar.cc/150?img=13", isMe: true },
    { id: 2, name:"Elizabeth-Jane", gender:"female", flag:"🇺🇸", img:"https://i.pravatar.cc/150?img=1" },
    { id: 3, name:"Maximilian", gender:"male", flag:"🇩🇪", img:"https://i.pravatar.cc/150?img=12" },
    { id: 4, name:"Sora", gender:"female", flag:"🇯🇵", img:"https://i.pravatar.cc/150?img=5" },
    { id: 5, name:"Alejandro", gender:"male", flag:"🇪🇸", img:"https://i.pravatar.cc/150?img=6" },
    { id: 6, name:"Chloe", gender:"female", flag:"🇫🇷", img:"https://i.pravatar.cc/150?img=9" },
    { id: 7, name:"Abdurahmon", gender:"male", flag:"🇦🇪", img:"https://i.pravatar.cc/150?img=11" },
    { id: 8, name:"Anna", gender:"female", flag:"🇬🇧", img:"https://i.pravatar.cc/150?img=16" }
];

function renderPlayers(){
    const container = document.getElementById("playersContainer");
    if(!container) return;
    container.innerHTML = "";

    const total = players.length;
    const containerWidth = container.offsetWidth || 340;
    const avatarSize = 52;
    const radius = (containerWidth / 2) - (avatarSize / 2) - 5; 
    const center = containerWidth / 2;

    players.forEach((player, index) => {
        const angleDeg = (index * (360 / total)) - 90; 
        const angleRad = angleDeg * (Math.PI / 180);

        const x = center + radius * Math.cos(angleRad) - (avatarSize / 2);
        const y = center + radius * Math.sin(angleRad) - (avatarSize / 2);

        const playerEl = document.createElement("div");
        playerEl.className = `player ${player.isMe ? 'is-me' : ''}`;
        playerEl.style.backgroundImage = `url('${player.img}')`;
        playerEl.style.left = `${x}px`;
        playerEl.style.top = `${y}px`;
        playerEl.dataset.id = player.id;
        playerEl.dataset.gender = player.gender;

        if (player.isMe) {
            playerEl.onclick = openFlagModal;
            playerEl.title = "Bayroqni o'zgartirish uchun bosing";
        }

        playerEl.innerHTML = `
            <div class="player-name-box" title="${player.name}">
                <span class="player-flag">${player.flag}</span>
                <span class="player-name">${player.name}</span>
            </div>
        `;

        let normalizedAngle = ((angleDeg % 360) + 360) % 360;
        playerEl.dataset.angle = normalizedAngle.toFixed(2);
        container.appendChild(playerEl);
    });
}

function openFlagModal() {
    document.getElementById("flagModal").classList.add("active");
}

function closeFlagModal() {
    document.getElementById("flagModal").classList.remove("active");
}

function selectFlag(flag) {
    const me = players.find(p => p.isMe);
    if(me) {
        me.flag = flag;
        renderPlayers();
    }
    closeFlagModal();
}

let currentRotation = 0;
let isSpinning = false;

function spinBottle(){
    if(isSpinning) return;
    isSpinning = true;

    const bottle = document.getElementById("bottle");
    const tableArea = document.getElementById("tableArea");
    
    tableArea.classList.add("spinning");
    document.querySelectorAll(".player.winner").forEach(el => el.classList.remove("winner"));

    // Shishani aylantirgan o'yinchi (Hozircha o'zimiz "isMe")
    const me = players.find(p => p.isMe);
    const myGender = me ? me.gender : 'male';

    // Faqat qarama-qarshi jinsdagi o'yinchilar ro'yxati
    const targetPlayers = players.filter(p => p.gender !== myGender);

    if(targetPlayers.length === 0) {
        isSpinning = false;
        tableArea.classList.remove("spinning");
        return;
    }

    // Qarama-qarshi jinsdagilardan tasodifiy bittasi tanlanadi
    const randomTarget = targetPlayers[Math.floor(Math.random() * targetPlayers.length)];
    const targetEl = document.querySelector(`.player[data-id="${randomTarget.id}"]`);
    
    // Tanlangan o'yinchining burchagi
    const targetAngle = parseFloat(targetEl.dataset.angle);

    // Shisha og'zi aynan shu o'yinchiga qarashi uchun aniq burchakni hisoblash
    const targetNeckAngle = (targetAngle + 90) % 360;
    const currentModulo = currentRotation % 360;
    
    let diff = targetNeckAngle - currentModulo;
    if (diff < 0) diff += 360;

    // Kamida 4 marta to'liq aylanadi (1440 deg) + aniq qarama-qarshi o'yinchi burchagiga to'xtaydi
    const finalRotation = currentRotation + 1440 + diff;
    currentRotation = finalRotation;

    bottle.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        isSpinning = false;
        tableArea.classList.remove("spinning");
        targetEl.classList.add("winner");
    }, 3200);
}

function sendMessage(){
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if(!text) return;

    const me = players.find(p => p.isMe);
    const myFlag = me ? me.flag : '🇺🇿';

    const messages = document.getElementById("chatMessages");
    const item = document.createElement("div");
    item.className = "chat-item";

    const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    item.innerHTML = `
        <div class="chat-avatar" style="background-image:url('${me.img}');"></div>
        <div>
            <div class="chat-username" style="color:#a87b47;">You ${myFlag}</div>
            <div class="chat-bubble">${safeText}</div>
        </div>
    `;

    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    input.value = "";
}

document.addEventListener("DOMContentLoaded", () => {
    renderPlayers();
});
</script>

</body>
</html>
