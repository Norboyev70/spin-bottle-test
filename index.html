<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Bottle Game Table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* O'YIN EKRANI */
        .game-screen {
            position: relative;
            width: 420px;
            height: 750px;
            max-height: 98vh; /* Ekranga to'liq sig'ishi uchun */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);

            /* YOG'OCH STOL FONI */
            background: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 28px,
                    rgba(65, 30, 10, 0.15) 28px,
                    rgba(65, 30, 10, 0.15) 30px
                ),
                radial-gradient(circle, #cc935c 0%, #a66f3b 60%, #7d4d23 100%);
        }

        /* YUQORI PANEL */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .stat-badge {
            background: rgba(139, 26, 26, 0.85);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .flag-badge {
            background: rgba(40, 40, 40, 0.85);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .table-num {
            background: rgba(40, 25, 15, 0.85);
            color: #d4a373;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        /* MARKAZIY NAQSH (PASTROQQAGA TUSHIRILDI - 36%) */
        .table-center {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0.25;
        }

        .compass-star {
            position: absolute;
            width: 220px;
            height: 220px;
        }

        /* O'YINCHILAR JOYLASHUVI (36%) */
        .players-container {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
        }

        .player {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #5a3a1e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background: #222;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player.active .avatar-box {
            border: 2.5px solid #4de94c;
            box-shadow: 0 0 12px #4de94c, inset 0 0 5px #4de94c;
        }

        .player-info {
            margin-top: 3px;
            background: rgba(0, 0, 0, 0.65);
            padding: 2px 8px;
            border-radius: 8px;
            color: #fff;
            font-size: 10.5px;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .player-info .flag-icon {
            font-size: 11px;
            line-height: 1;
        }

        /* SHISHA (BUTILKA) (36%) */
        .bottle {
            position: absolute;
            top: 36%;
            left: 50%;
            margin-top: -57px;
            margin-left: -21px;
            width: 42px;
            height: 115px;
            z-index: 15;
            cursor: pointer;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1);
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
        }

        .bottle svg {
            width: 100%;
            height: 100%;
        }

        /* CHAT BO'LIMI (BO'YI KICHIKLASHTIRILDI - 35%) */
        .chat-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(10, 5, 2, 0.85) 25%, rgba(10, 5, 2, 0.95) 100%);
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            z-index: 25;
            backdrop-filter: blur(4px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
            margin-bottom: 8px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(212, 163, 115, 0.4);
            border-radius: 4px;
        }

        .chat-msg {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 8px;
            border-left: 3px solid #d4a373;
            max-width: 90%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg .user-name {
            font-size: 11px;
            font-weight: bold;
            color: #e0a96d;
            white-space: nowrap;
        }

        .chat-msg .text {
            font-size: 11.5px;
            color: #ddd;
            word-break: break-word;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 20, 10, 0.8);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 20px;
            padding: 4px 6px 4px 14px;
        }

        .chat-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 12px;
        }

        .chat-input-area input::placeholder {
            color: #888;
        }

        .send-btn {
            background: #a66f3b;
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #cc935c;
        }
    </style>
</head>
<body>

<div class="game-screen">

    <!-- YUQORI BAR -->
    <div class="top-bar">
        <div class="stat-badge">❤️ 10,000</div>
        <div class="flag-badge">🎟️ 8</div>
        <div class="table-num">TABLE #229</div>
    </div>

    <!-- MARKAZDAGI NAQSH -->
    <div class="table-center">
        <svg class="compass-star" viewBox="0 0 200 200">
            <g fill="none" stroke="#250f04" stroke-width="1.2">
                <polygon points="100,5 106,94 100,100 94,94" fill="#3a1905" />
                <polygon points="100,195 106,106 100,100 94,106" fill="#3a1905" />
                <polygon points="195,100 106,106 100,100 106,94" fill="#3a1905" />
                <polygon points="5,100 94,106 100,100 94,94" fill="#3a1905" />

                <polygon points="167,33 104,93 100,100 107,96" fill="#2c1203" />
                <polygon points="33,167 96,107 100,100 93,104" fill="#2c1203" />
                <polygon points="167,167 107,104 100,100 104,107" fill="#2c1203" />
                <polygon points="33,33 93,96 100,100 96,93" fill="#2c1203" />

                <g fill="#1a0901">
                    <polygon points="135,22 102,96 100,100" />
                    <polygon points="178,65 104,98 100,100" />
                    <polygon points="178,135 104,102 100,100" />
                    <polygon points="135,178 102,104 100,100" />
                    <polygon points="65,178 98,104 100,100" />
                    <polygon points="22,135 96,102 100,100" />
                    <polygon points="22,65 96,98 100,100" />
                    <polygon points="65,22 98,96 100,100" />
                </g>
            </g>
            <circle cx="100" cy="100" r="4" fill="#150600" />
        </svg>
    </div>

    <!-- O'YINCHILAR -->
    <div class="players-container" id="playersContainer"></div>

    <!-- BUTILKA -->
    <div class="bottle" id="bottle" onclick="spinBottle()">
        <svg viewBox="0 0 50 140">
            <path d="M 18,5 L 32,5 L 32,25 L 42,45 L 42,125 C 42,135 8,135 8,125 L 8,45 L 18,25 Z" fill="#2e5d32" stroke="#1b3b1e" stroke-width="2"/>
            <rect x="10" y="60" width="30" height="35" rx="3" fill="#cfb997" stroke="#8c785c" stroke-width="1"/>
            <text x="25" y="77" font-size="7" fill="#333" text-anchor="middle" font-weight="bold">SPIN THE</text>
            <text x="25" y="86" font-size="7" fill="#333" text-anchor="middle" font-weight="bold">BOTTLE</text>
            <rect x="17" y="2" width="16" height="5" fill="#b5832a" rx="1"/>
        </svg>
    </div>

    <!-- CHAT SECTION -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg">
                <span class="user-name">🇺🇿 Muhammad:</span>
                <span class="text">Salom hammaga! 👋</span>
            </div>
            <div class="chat-msg">
                <span class="user-name">🇮🇹 Sofia:</span>
                <span class="text">Ciao! Who spins next? 🍾</span>
            </div>
            <div class="chat-msg">
                <span class="user-name">🇧🇷 Lucas:</span>
                <span class="text">Let's go guys!! 🔥</span>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Xabar yozing..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

</div>

<script>
    const playersData = [
        { name: "Muhammad", flag: "🇺🇿", img: "https://i.pravatar.cc/100?img=11" },
        { name: "Elizabeth", flag: "🇺🇸", img: "https://i.pravatar.cc/100?img=5" },
        { name: "Maximilian", flag: "🇩🇪", img: "https://i.pravatar.cc/100?img=12" },
        { name: "Sora", flag: "🇯🇵", img: "https://i.pravatar.cc/100?img=9" },
        { name: "Alejandro", flag: "🇪🇸", img: "https://i.pravatar.cc/100?img=68" },
        { name: "Chloe", flag: "🇫🇷", img: "https://i.pravatar.cc/100?img=47" },
        { name: "Abdurahmon", flag: "🇦🇪", img: "https://i.pravatar.cc/100?img=57" },
        { name: "Anna", flag: "🇬🇧", img: "https://i.pravatar.cc/100?img=38" },
        { name: "Lucas", flag: "🇧🇷", img: "https://i.pravatar.cc/100?img=14", active: true },
        { name: "Sofia", flag: "🇮🇹", img: "https://i.pravatar.cc/100?img=26", active: true },
        { name: "Dmitry", flag: "🇰🇿", img: "https://i.pravatar.cc/100?img=3" },
        { name: "Zara", flag: "🇹🇷", img: "https://i.pravatar.cc/100?img=20" }
    ];

    const container = document.getElementById('playersContainer');
    const totalPlayers = playersData.length;
    const radius = 148;

    playersData.forEach((player, index) => {
        const angle = (index * (360 / totalPlayers) - 90) * (Math.PI / 180);
        const x = 160 + radius * Math.cos(angle);
        const y = 160 + radius * Math.sin(angle);

        const playerEl = document.createElement('div');
        playerEl.className = `player ${player.active ? 'active' : ''}`;
        playerEl.style.left = `${x}px`;
        playerEl.style.top = `${y}px`;

        playerEl.innerHTML = `
            <div class="avatar-box">
                <img src="${player.img}" alt="${player.name}">
            </div>
            <div class="player-info">
                <span class="flag-icon">${player.flag}</span>
                <span>${player.name}</span>
            </div>
        `;
        container.appendChild(playerEl);
    });

    let currentRotation = 0;
    function spinBottle() {
        const randomDegree = Math.floor(1800 + Math.random() * 360);
        currentRotation += randomDegree;
        document.getElementById('bottle').style.transform = `rotate(${currentRotation}deg)`;
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (text !== "") {
            const chatBox = document.getElementById('chatMessages');
            const newMsg = document.createElement('div');
            newMsg.className = 'chat-msg';
            newMsg.innerHTML = `
                <span class="user-name">🇺🇿 Siz:</span>
                <span class="text">${escapeHtml(text)}</span>
            `;
            chatBox.appendChild(newMsg);
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function escapeHtml(string) {
        return String(string).replace(/[&<>"']/g, function (s) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[s];
        });
    }
</script>

</body>
