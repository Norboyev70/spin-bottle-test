<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin the Bottle - Fixed Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: radial-gradient(circle at center, #2e1809 0%, #120803 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.95);
            border-radius: 28px;
            overflow: hidden;
            color: #fff;
        }

        /* Top Header Navigation */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            font-size: 18px;
            font-weight: 700;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 14px 12px 14px;
        }

        .heart-badge {
            background: linear-gradient(180deg, #ff4e3a, #ba1100);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(255, 78, 58, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-item {
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 9px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Table Playfield Area */
        .table-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .table-center-ring {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 2px dashed rgba(212, 163, 89, 0.25);
            position: absolute;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Bottle */
        .bottle {
            width: 44px;
            height: 130px;
            background: radial-gradient(circle at 35% 30%, #4ae368, #094717);
            border-radius: 20px 20px 10px 10px;
            position: absolute;
            transform: rotate(45deg);
            box-shadow: 0 12px 24px rgba(0,0,0,0.8), inset -3px -3px 6px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 5;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1);
            cursor: pointer;
        }

        /* Players Container */
        .players-container {
            width: 350px;
            height: 350px;
            position: relative;
        }

        .player {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            box-shadow: 0 5px 16px rgba(0,0,0,0.8);
            border: 2.5px solid #ff2a8d;
            z-index: 10;
        }

        .player.pink { border-color: #ff2a8d; box-shadow: 0 0 12px rgba(255, 42, 141, 0.85); }
        .player.blue { border-color: #00bfff; box-shadow: 0 0 12px rgba(0, 191, 255, 0.85); }
        .player.gold { border-color: #ffd700; box-shadow: 0 0 14px rgba(255, 215, 0, 0.95); }

        /* Aniq ko'rinadigan Niklar */
        .player-name {
    position: absolute;
    bottom: -18px;
    font-size: 10px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 4px #000, 0 0 4px #000;
    
    max-width: 62px;         /* Maksimal kenglik */
    overflow: hidden;        /* Sig'magan qismini ko'rinmas (shunchaki kesilgan) qilish */
    white-space: nowrap;     /* Bir qatorda ushlab turish */
    
    background: rgba(0, 0, 0, 0.6);
    padding: 1px 5px;
    border-radius: 6px;
    z-index: 15;
    cursor: pointer;
}
        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            font-size: 10px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            border: 1.5px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            z-index: 20;
        }

        /* Chat Section */
        .chat-section {
            background: #ffffff;
            color: #111;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            height: 300px;
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.4);
            z-index: 30;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-weight: 700;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-size: cover;
            flex-shrink: 0;
        }

        .chat-username { font-weight: 700; font-size: 11px; color: #444; }
        .chat-bubble {
            background: #f1f2f6;
            padding: 7px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-top: 2px;
            color: #222;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 6px;
        }

        .chat-input {
            flex: 1;
            background: #f1f2f6;
            border: 1px solid #e1e2e6;
            padding: 10px 16px;
            border-radius: 20px;
            outline: none;
            font-size: 12px;
        }

        .send-btn {
            background: #0d0d0d;
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-nav">
        <span>✕</span>
        <div>Spin the Bottle 🍾❤️</div>
        <span>⋮</span>
    </div>

    <div class="stats-bar">
        <div class="heart-badge">❤️ 10000</div>
        <div class="stat-item">🎟️ 8 d.</div>
        <div class="stat-item">🎯 #</div>
        <div class="stat-item">⚙️</div>
        <div class="stat-item">Table 229 🔄</div>
    </div>

   <div class="table-area">
    <div class="table-center-ring"></div>
    <div class="bottle" id="bottle" onclick="spinBottle()"></div>
    
    <div class="players-container">
        <!-- Har bir o'yinchi p1, p2, p3... sinfi bilan belgilanadi -->
        <div class="player gold p1" style="background-image: url('https://i.pravatar.cc/150?img=1');">
            <span class="badge">4</span>
            <span class="player-name" title="Aziza">Aziza</span>
        </div>
        <div class="player pink p2" style="background-image: url('https://i.pravatar.cc/150?img=2');">
            <span class="badge">2</span>
            <span class="player-name" title="Malika 👑">Malika 👑</span>
        </div>
        <!-- SEVINCH (p3) -->
        <div class="player pink p3" style="background-image: url('https://i.pravatar.cc/150?img=3');">
            <span class="badge">1</span>
            <span class="player-name" title="Sevinch">Sevinch</span>
        </div>
        <!-- GULNOZA (p4) -->
        <div class="player pink p4" style="background-image: url('https://i.pravatar.cc/150?img=4');">
            <span class="badge">1</span>
            <span class="player-name" title="Gulnoza">Gulnoza</span>
        </div>
        <div class="player pink p5" style="background-image: url('https://i.pravatar.cc/150?img=5');">
            <span class="badge">5</span>
            <span class="player-name" title="Nilufar">Nilufar</span>
        </div>
        <div class="player blue p6" style="background-image: url('https://i.pravatar.cc/150?img=6');">
            <span class="badge">5</span>
            <span class="player-name" title="Fazliddin">Fazliddin</span>
        </div>
        <div class="player pink p7" style="background-image: url('https://i.pravatar.cc/150?img=7');">
            <span class="badge">5</span>
            <span class="player-name" title="Dildora">Dildora</span>
        </div>
        <div class="player blue p8" style="background-image: url('https://i.pravatar.cc/150?img=8');">
            <span class="badge">1</span>
            <span class="player-name" title="Sardor ✔">Sardor ✔</span>
        </div>
        <div class="player gold p9" style="background-image: url('https://i.pravatar.cc/150?img=9');">
            <span class="badge">1</span>
            <span class="player-name" title="Madina">Madina</span>
        </div>
        <div class="player blue p10" style="background-image: url('https://i.pravatar.cc/150?img=10');">
            <span class="badge">1</span>
            <span class="player-name" title="Jasur ✔">Jasur ✔</span>
        </div>
        <div class="player pink p11" style="background-image: url('https://i.pravatar.cc/150?img=11');">
            <span class="badge">1</span>
            <span class="player-name" title="Madina">Madina</span>
        </div>
        <div class="player blue p12" style="background-image: url('https://i.pravatar.cc/150?img=12');">
            <span class="badge">1</span>
            <span class="player-name" title="Bekzod ✔">Bekzod ✔</span>
        </div>
    </div>
</div>
<script>
    const players = [
        { name: "Aziza", img: "https://i.pravatar.cc/150?img=1", badge: 4, type: "gold" },
        { name: "julijamolovna 👑", img: "https://i.pravatar.cc/150?img=2", badge: 2, type: "pink" },
        { name: "Sevinch", img: "https://i.pravatar.cc/150?img=3", badge: 1, type: "pink" },
        { name: "Gulnoza", img: "https://i.pravatar.cc/150?img=4", badge: 1, type: "pink" },
        { name: "Nilufar", img: "https://i.pravatar.cc/150?img=5", badge: 5, type: "pink" },
        { name: "Fazliddin", img: "https://i.pravatar.cc/150?img=6", badge: 5, type: "blue" },
        { name: "Dildora", img: "https://i.pravatar.cc/150?img=7", badge: 5, type: "pink" },
        { name: "Sardor ✔", img: "https://i.pravatar.cc/150?img=8", badge: 1, type: "blue" },
        { name: "Madina", img: "https://i.pravatar.cc/150?img=9", badge: 1, type: "gold" },
        { name: "Jasur ✔", img: "https://i.pravatar.cc/150?img=10", badge: 1, type: "blue" },
        { name: "Madina", img: "https://i.pravatar.cc/150?img=11", badge: 1, type: "pink" },
        { name: "Bekzod ✔", img: "https://i.pravatar.cc/150?img=12", badge: 1, type: "blue" }
    ];

    function renderPlayers() {
        const container = document.getElementById("playersContainer");
        container.innerHTML = "";
        
        const total = players.length;
        const radius = 150; 
        const avatarSize = 58; 
        const centerOffset = 165 - (avatarSize / 2); 

        players.forEach((player, index) => {
            const angleDeg = (index * (360 / total)) - 360; 
            const angleRad = angleDeg * (Math.PI / 180);

            // Barcha o'yinchilar o'ngroqqa (+12px) surildi:
            const x = centerOffset + radius * Math.cos(angleRad) + 12;
            const y = centerOffset + radius * Math.sin(angleRad);

            const playerEl = document.createElement("div");
            playerEl.className = `player ${player.type}`;
            playerEl.style.backgroundImage = `url('${player.img}')`;
            playerEl.style.left = `${x}px`;
            playerEl.style.top = `${y}px`;

            playerEl.innerHTML = `
                <span class="badge">${player.badge}</span>
                <span class="player-name">${player.name}</span>
            `;

            container.appendChild(playerEl);
        });
    }

    let currentRotation = 45;
    function spinBottle() {
        const bottle = document.getElementById("bottle");
        const extraDegrees = Math.floor(Math.random() * 360) + 1440;
        currentRotation += extraDegrees;
        bottle.style.transform = `rotate(${currentRotation}deg)`;
    }

    renderPlayers();
</script>

</body>
</html>
