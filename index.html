<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Spin Bottle</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#111;
}

body{
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:600px;
    height:100vh;
    background:#f4f4f4;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   GAME AREA
========================= */

.game{
    height:50%;
    min-height:50%;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        #ead4ae 0%,
        #d8b47b 48%,
        #c3955d 100%);
}

/* top panel */

.topbar{
    position:absolute;
    left:12px;
    right:12px;
    top:10px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:20;
}

.top-left,
.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.82);
    box-shadow:0 4px 12px rgba(0,0,0,.14);
    font-size:19px;
}

.balance{
    height:38px;
    padding:0 12px;
    border-radius:12px;
    background:rgba(255,255,255,.88);
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:800;
    font-size:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.heart{
    color:#e94863;
    font-size:20px;
}

/* =========================
   TABLE
========================= */

.table{
    position:absolute;
    width:92vw;
    height:92vw;
    max-width:540px;
    max-height:540px;
    min-width:360px;
    min-height:360px;

    left:50%;
    top:57%;
    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle,
        #f1d6a6 0%,
        #e4c18b 48%,
        #d3a96e 100%);

    box-shadow:
        0 18px 35px rgba(73,44,19,.32),
        inset 0 0 35px rgba(112,73,33,.12);

    border:none;
}

/* wood decoration */

.table::before{
    content:"";
    position:absolute;
    inset:13px;
    border-radius:50%;
    border:1px solid rgba(116,75,33,.16);
    pointer-events:none;
}

.table::after{
    content:"";
    position:absolute;
    inset:28px;
    border-radius:50%;
    border:1px dashed rgba(116,75,33,.13);
    pointer-events:none;
}

/* =========================
   CENTER
========================= */

.center{
    position:absolute;
    left:50%;
    top:50%;
    width:130px;
    height:130px;
    transform:translate(-50%,-50%);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle,
        rgba(255,255,255,.5),
        rgba(255,255,255,.12) 65%,
        transparent 66%);

    z-index:4;
}

.center-ring{
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid rgba(107,69,30,.22);
}

.center-ring2{
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:1px dashed rgba(107,69,30,.22);
}

.bottle{
    width:110px;
    height:38px;
    position:relative;
    transform-origin:center;
    cursor:pointer;
    z-index:8;
    transition:transform .08s linear;
}

.bottle-body{
    position:absolute;
    width:70px;
    height:25px;
    left:22px;
    top:7px;
    border-radius:14px 7px 7px 14px;

    background:
        linear-gradient(
            180deg,
            #79b58b,
            #43855e
        );

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.5),
        0 4px 7px rgba(0,0,0,.22);
}

.bottle-neck{
    position:absolute;
    width:28px;
    height:13px;
    left:78px;
    top:13px;
    background:#4c9568;
    border-radius:0 7px 7px 0;
}

.bottle-cap{
    position:absolute;
    width:9px;
    height:9px;
    left:100px;
    top:15px;
    border-radius:3px;
    background:#2d6748;
}

.bottle-highlight{
    position:absolute;
    left:32px;
    top:10px;
    width:43px;
    height:5px;
    border-radius:5px;
    background:rgba(255,255,255,.35);
}

/* =========================
   PLAYERS
========================= */

.player{
    position:absolute;
    width:92px;
    text-align:center;
    z-index:10;
    transform:translate(-50%,-50%);
}
}

.avatar-wrap{
    position:relative;
    width:82px;
    height:82px;
    margin:auto;
}

.avatar{
    width:76px;
    height:76px;
    border-radius:20px;
    object-fit:cover;
    display:block;
    margin:3px auto;
    border:3px solid #fff;
    box-shadow:0 5px 12px rgba(0,0,0,.28);
}
.avatar{
    width:72px;
    height:72px;
    border-radius:20px;
    object-fit:cover;
    display:block;
    margin:3px auto;
    border:3px solid #fff;
    box-shadow:0 5px 12px rgba(0,0,0,.28);
}

.frame{
    position:absolute;
    inset:0;
    border:4px solid #d4a85b;
    border-radius:23px;
    pointer-events:none;
}

.kiss{
    position:absolute;
    right:-7px;
    top:-8px;

    min-width:29px;
    height:29px;

    padding:0 7px;
    border-radius:15px;

    background:#fff;
    color:#e94863;

    font-size:13px;
    font-weight:900;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 9px rgba(0,0,0,.22);
}

.player-name{
    margin-top:6px;

    font-size:12px;
    font-weight:900;

    color:#3f2b19;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.player-name{
    margin-top:5px;
    font-size:11px;
    font-weight:800;
    color:#4b351f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player.active .avatar{
    box-shadow:
        0 0 0 3px #fff,
        0 0 0 6px #e54b61,
        0 5px 12px rgba(0,0,0,.3);
}

/* =========================
   CHAT
========================= */

.chat{
    height:50%;
    background:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
}

.chat-head{
    height:48px;
    min-height:48px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.chat-title{
    font-size:15px;
    font-weight:900;
    color:#222;
}

.online{
    font-size:11px;
    color:#888;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:10px 13px 70px;
}

.message{
    display:flex;
    margin-bottom:10px;
}

.message.me{
    justify-content:flex-end;
}

.bubble{
    max-width:75%;
    padding:9px 12px;
    border-radius:15px;
    background:#f1f1f1;
    color:#222;
    font-size:13px;
    line-height:1.3;
}

.message.me .bubble{
    background:#222;
    color:white;
    border-bottom-right-radius:4px;
}

.message:not(.me) .bubble{
    border-bottom-left-radius:4px;
}

.msg-name{
    font-size:9px;
    color:#999;
    margin-bottom:2px;
}

/* input */

.chat-input{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;

    height:48px;
    display:flex;
    gap:7px;
}

.chat-input input{
    flex:1;
    min-width:0;
    border:1px solid #e3e3e3;
    outline:none;
    border-radius:15px;
    padding:0 14px;
    font-size:13px;
    background:#fafafa;
}

.send{
    width:48px;
    border:none;
    border-radius:15px;
    background:#222;
    color:white;
    font-size:18px;
}

/* =========================
   QUICK MESSAGES
========================= */

.quick{
    position:absolute;
    bottom:65px;
    left:10px;
    right:10px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    flex:none;
    border:1px solid #eee;
    background:white;
    padding:7px 11px;
    border-radius:12px;
    font-size:11px;
    box-shadow:0 2px 5px rgba(0,0,0,.06);
}

/* =========================
   SPIN EFFECT
========================= */

.spinning{
    animation:bottleSpin 2.8s cubic-bezier(.15,.8,.2,1);
}

@keyframes bottleSpin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(1080deg);
    }
}

/* kiss animation */

.kiss-fx{
    position:absolute;
    font-size:30px;
    pointer-events:none;
    z-index:50;
    animation:kissFly 1s ease forwards;
}

@keyframes kissFly{
    0%{
        transform:translate(-50%,0) scale(.4);
        opacity:0;
    }
    30%{
        opacity:1;
        transform:translate(-50%,-20px) scale(1.2);
    }
    100%{
        transform:translate(-50%,-100px) scale(.8);
        opacity:0;
    }
}

/* =========================
   TELEFON
========================= */

@media (max-width: 699px){

    .app{
        width:100%;
        height:100vh;
        max-width:none;
    }

    .game{
        height:50vh;
        min-height:50vh;
    }

    .chat{
        height:50vh;
        min-height:50vh;
    }

    .table{
        width:92vw;
        height:92vw;

        min-width:0;
        min-height:0;

        max-width:none;
        max-height:none;

        top:57%;
    }

    .player{
        width:100px;
    }

    .avatar-wrap{
        width:80px;
        height:80px;
    }

    .avatar{
        width:74px;
        height:74px;
        border-radius:20px;
    }

    .frame{
        border-radius:22px;
        border-width:4px;
    }

    .kiss{
        min-width:27px;
        height:27px;
        font-size:12px;
    }

    .player-name{
        font-size:11px;
    }

    .center{
        width:115px;
        height:115px;
    }

    .bottle{
        transform:scale(.9);
    }
}


/* KICHIK TELEFONLAR */

@media (max-width:400px){

    .table{
        width:94vw;
        height:94vw;
        top:58%;
    }

    .player{
        width:88px;
    }

    .avatar-wrap{
        width:70px;
        height:70px;
    }

    .avatar{
        width:65px;
        height:65px;
        border-radius:18px;
    }

    .frame{
        border-radius:19px;
    }

    .player-name{
        font-size:10px;
    }

    .center{
        width:105px;
        height:105px;
    }
}


/* =========================
   KOMPYUTER
========================= */

@media (min-width:700px){

    body{
        background:#171717;
    }

    .app{
        width:100%;
        max-width:1100px;
        height:100vh;

        display:flex;
        flex-direction:row;
    }

    .game{
        width:60%;
        height:100vh;
        min-height:100vh;
    }

    .chat{
        width:40%;
        height:100vh;
        min-height:100vh;

        border-left:1px solid #ddd;
    }

    .table{
        width:min(52vw,620px);
        height:min(52vw,620px);

        min-width:500px;
        min-height:500px;

        top:53%;
    }

    .player{
        width:115px;
    }

    .avatar-wrap{
        width:92px;
        height:92px;
    }

    .avatar{
        width:86px;
        height:86px;
        border-radius:23px;
    }

    .frame{
        border-radius:25px;
        border-width:4px;
    }

    .kiss{
        min-width:30px;
        height:30px;
        font-size:13px;
    }

    .player-name{
        font-size:12px;
    }

    .center{
        width:140px;
        height:140px;
    }

    .bottle{
        transform:scale(1.05);
    }

    .chat-head{
        height:58px;
    }

    .chat-title{
        font-size:17px;
    }

    .messages{
        padding:15px;
    }

    .bubble{
        font-size:14px;
    }
}</style>
</head>

<body>

<div class="app">

    <!-- ================= GAME ================= -->

    <section class="game">

        <div class="topbar">

            <div class="top-left">
                <button class="icon-btn">☰</button>
            </div>

            <div class="top-right">
                <div class="balance">
                    <span class="heart">♥</span>
                    <span id="heartCount">11250</span>
                </div>

                <button class="icon-btn">🏆</button>
            </div>

        </div>

        <div class="table" id="table">

            <div class="center">

                <div class="center-ring"></div>
                <div class="center-ring2"></div>

                <div class="bottle" id="bottle">

                    <div class="bottle-body">
                        <div class="bottle-highlight"></div>
                    </div>

                    <div class="bottle-neck"></div>
                    <div class="bottle-cap"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= CHAT ================= -->

    <section class="chat">

        <div class="chat-head">
            <div class="chat-title">Stol chati</div>
            <div class="online">12 o‘yinchi</div>
        </div>

        <div class="messages" id="messages">

            <div class="message">
                <div>
                    <div class="msg-name">Madina</div>
                    <div class="bubble">
                        Salom hammaga 👋
                    </div>
                </div>
            </div>

            <div class="message">
                <div>
                    <div class="msg-name">Jasur</div>
                    <div class="bubble">
                        Kim navbatda? 😄
                    </div>
                </div>
            </div>

            <div class="message me">
                <div class="bubble">
                    Boshladik 🔥
                </div>
            </div>

        </div>

        <div class="quick">

            <button>Salom 👋</button>
            <button>Navbat kimda?</button>
            <button>😄</button>
            <button>❤️</button>
            <button>Qani ketdik!</button>

        </div>

        <div class="chat-input">

            <input
                id="messageInput"
                type="text"
                placeholder="Xabar yozing..."
            >

            <button
                class="send"
                id="sendBtn"
            >➤</button>

        </div>

    </section>

</div>


<script>

/* ==========================================
   PLAYERS
========================================== */

const players = [

    {
        name:"Madina",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=47",
        kiss:12
    },

    {
        name:"Jasur",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=12",
        kiss:5
    },

    {
        name:"Malika",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=44",
        kiss:18
    },

    {
        name:"Aziz",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=11",
        kiss:3
    },

    {
        name:"Zarina",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=32",
        kiss:25
    },

    {
        name:"Bekzod",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=13",
        kiss:7
    },

    {
        name:"Shahnoza",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=49",
        kiss:9
    },

    {
        name:"Sardor",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=14",
        kiss:4
    },

    {
        name:"Dilnoza",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=45",
        kiss:16
    },

    {
        name:"Doston",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=15",
        kiss:8
    },

    {
        name:"Gulnoza",
        gender:"girl",
        avatar:"https://i.pravatar.cc/100?img=48",
        kiss:11
    },

    {
        name:"Bobur",
        gender:"boy",
        avatar:"https://i.pravatar.cc/100?img=16",
        kiss:6
    }

];


/* ==========================================
   SEAT PLAYERS
========================================== */

const table = document.getElementById("table");

const positions = [
    [45, 13],
    [59, 12],
    [83, 25],
    [87, 40],
    [83, 58],
    [69, 73],
    [50, 77],
    [31, 73],
    [17, 58],
    [13, 40],
    [17, 22],
    [31, 10]
];
players.forEach((player,index)=>{

    const el = document.createElement("div");

    el.className =
        "player" +
        (index === 0 ? " active" : "");

    el.style.left =
        positions[index][0] + "%";

    el.style.top =
        positions[index][1] + "%";

    el.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${player.avatar}"
                alt=""
            >

            <div class="frame"></div>

            <div class="kiss">
                ♥ ${player.kiss}
            </div>

        </div>

        <div class="player-name">
            ${player.name}
        </div>

    `;

    table.appendChild(el);

});


/* ==========================================
   BOTTLE
========================================== */

const bottle =
    document.getElementById("bottle");

let spinning = false;

let currentPlayer =
    players[0];


/*
    O'yinchi jinsiga qarab
    qarama-qarshi jinsni tanlaymiz.
*/

function getTarget(){

    const possible =
        players.filter(player => {

            return player.gender !==
                   currentPlayer.gender;

        });

    return possible[
        Math.floor(
            Math.random() *
            possible.length
        )
    ];

}


/* ==========================================
   SPIN
========================================== */

bottle.addEventListener("click",()=>{

    if(spinning) return;

    spinning = true;

    const target =
        getTarget();

    /*
       Bottle aylanishi.
       Bu yerda faqat vizual effekt.
       Natija esa qarama-qarshi jinsdan tanlanadi.
    */

    bottle.classList.remove("spinning");

    void bottle.offsetWidth;

    bottle.classList.add("spinning");


    setTimeout(()=>{

        bottle.classList.remove("spinning");

        spinning = false;

        showTarget(target);

    },2800);

});


/* ==========================================
   SHOW TARGET
========================================== */

function showTarget(target){

    document
        .querySelectorAll(".player")
        .forEach(el=>{
            el.classList.remove("active");
        });


    const index =
        players.indexOf(target);

    const all =
        document.querySelectorAll(".player");

    if(all[index]){
        all[index].classList.add("active");
    }


    addMessage(
        "Tizim",
        `💋 Shisha ${target.name} ga tushdi!`
    );

}


/* ==========================================
   CHAT
========================================== */

const input =
    document.getElementById(
        "messageInput"
    );

const send =
    document.getElementById(
        "sendBtn"
    );

const messages =
    document.getElementById(
        "messages"
    );


function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    const message =
        document.createElement("div");

    message.className =
        "message me";

    message.innerHTML = `
        <div class="bubble">
            ${escapeHTML(text)}
        </div>
    `;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop =
        messages.scrollHeight;

}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter"){
            sendMessage();
        }

    }
);


/* ==========================================
   QUICK MESSAGES
========================================== */

document
    .querySelectorAll(".quick button")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                input.value =
                    button.textContent;

                sendMessage();

            }
        );

    });


function addMessage(name,text){

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.innerHTML = `

        <div>

            <div class="msg-name">
                ${name}
            </div>

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

        </div>

    `;

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

}


/* ==========================================
   XSS PROTECTION
========================================== */

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==========================================
   KISS EFFECT
========================================== */

function kissEffect(x,y){

    const el =
        document.createElement("div");

    el.className =
        "kiss-fx";

    el.textContent =
        "💋";

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    table.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },1000);

}


/* ==========================================
   KISS DEMO
========================================== */

document
    .querySelectorAll(".player")
    .forEach(player=>{

        player.addEventListener(
            "dblclick",
            e=>{

                const rect =
                    table.getBoundingClientRect();

                kissEffect(
                    e.clientX -
                    rect.left,

                    e.clientY -
                    rect.top
                );

            }
        );

    });

</script>

</body>
</html>
