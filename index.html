<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Bottle</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

h1 {
    margin: 0 0 15px;
    font-size: 28px;
}

.table {
    position: relative;
    width: min(90vw, 550px);
    height: min(90vw, 550px);
    max-width: 550px;
    max-height: 550px;
    min-width: 300px;
    min-height: 300px;
    border-radius: 50%;
    background:
        radial-gradient(circle, #9b5a2b 0%, #75401e 65%, #4a2512 100%);
    border: 15px solid #30170c;
    box-shadow:
        0 20px 40px rgba(0,0,0,.5),
        inset 0 0 30px rgba(0,0,0,.4);
}

/* stol bezagi */
.table::after {
    content: "";
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.08);
    pointer-events: none;
}

/* O'yinchi */
.player {
    position: absolute;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #263244;
    border: 4px solid #64748b;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 6px 12px rgba(0,0,0,.45);
    z-index: 5;
    transition: .3s;
}

.player.active {
    background: #16a34a;
    border-color: #86efac;
    transform: scale(1.15);
    box-shadow: 0 0 25px rgba(34,197,94,.9);
}

/* 4 ta o'yinchi */
.p1 {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

.p2 {
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
}

.p3 {
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
}

.p4 {
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
}

/* markaz */
.center {
    position: absolute;
    width: 170px;
    height: 170px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Butilka */
.bottle {
    width: 150px;
    height: 48px;
    position: relative;
    cursor: pointer;
    transform-origin: 50% 50%;
    user-select: none;
    touch-action: manipulation;
    z-index: 10;
}

/* butilka tanasi */
.bottle-body {
    position: absolute;
    left: 45px;
    top: 7px;
    width: 85px;
    height: 34px;
    border-radius: 18px 12px 12px 18px;
    background: linear-gradient(
        to bottom,
        #f7fafc,
        #cbd5e1 45%,
        #64748b 55%,
        #e2e8f0
    );
    border: 2px solid #334155;
    box-shadow:
        inset 0 4px 5px rgba(255,255,255,.8),
        0 5px 10px rgba(0,0,0,.4);
}

/* bo'yin */
.bottle-neck {
    position: absolute;
    left: 27px;
    top: 13px;
    width: 45px;
    height: 22px;
    background: linear-gradient(to bottom,#f8fafc,#94a3b8);
    border: 2px solid #334155;
    border-right: none;
}

/* og'iz */
.bottle-mouth {
    position: absolute;
    left: 17px;
    top: 11px;
    width: 18px;
    height: 26px;
    border-radius: 5px;
    background: #e2e8f0;
    border: 3px solid #334155;
}

/* aylanish */
.bottle.spinning {
    animation: spin 2.8s cubic-bezier(.12,.7,.18,1) forwards;
}

@keyframes spin {
    0% {
        transform: rotate(0deg);
    }
    15% {
        transform: rotate(600deg);
    }
    40% {
        transform: rotate(1500deg);
    }
    70% {
        transform: rotate(2200deg);
    }
    100% {
        transform: rotate(2520deg);
    }
}

.info {
    margin-top: 20px;
    text-align: center;
    min-height: 50px;
}

.info .result {
    font-size: 22px;
    font-weight: bold;
}

.info .hint {
    margin-top: 7px;
    color: #94a3b8;
    font-size: 14px;
}

/* telefon */
@media (max-width: 420px) {
    .game {
        padding: 10px;
    }

    h1 {
        font-size: 23px;
    }

    .table {
        width: 88vw;
        height: 88vw;
        min-width: 280px;
        min-height: 280px;
        border-width: 11px;
    }

    .player {
        width: 62px;
        height: 62px;
        font-size: 11px;
    }

    .bottle {
        transform: scale(.82);
    }

    .center {
        width: 145px;
        height: 145px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🍾 Spin Bottle</h1>

    <div class="table">

        <div class="player p1" data-player="1">
            Player 1
        </div>

        <div class="player p2" data-player="2">
            Player 2
        </div>

        <div class="player p3" data-player="3">
            Player 3
        </div>

        <div class="player p4" data-player="4">
            Player 4
        </div>

        <div class="center">

            <div class="bottle" id="bottle" title="Butilkaga bosing">

                <div class="bottle-body"></div>
                <div class="bottle-neck"></div>
                <div class="bottle-mouth"></div>

            </div>

        </div>

    </div>

    <div class="info">
        <div class="result" id="result">
            Butilkaga bosing 🍾
        </div>

        <div class="hint">
            Butilka qaysi o'yinchiga tushishini ko'ring
        </div>
    </div>

</div>

<script>
const bottle = document.getElementById("bottle");
const players = document.querySelectorAll(".player");
const result = document.getElementById("result");

let busy = false;

bottle.addEventListener("click", () => {

    if (busy) return;

    busy = true;

    players.forEach(player => {
        player.classList.remove("active");
    });

    result.textContent = "Aylanmoqda... 🔄";

    // Eski animatsiyani tozalash
    bottle.classList.remove("spinning");

    // Browserga qayta hisoblatish
    void bottle.offsetWidth;

    bottle.classList.add("spinning");

    // Tasodifiy o'yinchi
    const winner = Math.floor(Math.random() * 4) + 1;

    setTimeout(() => {

        bottle.classList.remove("spinning");

        const selected = document.querySelector(
            `[data-player="${winner}"]`
        );

        selected.classList.add("active");

        result.textContent =
            "🎯 Player " + winner + " ga tushdi!";

        busy = false;

    }, 2850);

});
</script>

</body>
</html>
