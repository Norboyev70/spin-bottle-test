<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Spin the Bottle - Oak Table</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;
}

body{
    background:#17100a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game-container{
    width:100%;
    max-width:414px;
    height:100vh;
    max-height:896px;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,220,166,.45) 0%,
            rgba(222,172,111,.25) 38%,
            rgba(151,91,45,.12) 65%,
            transparent 88%
        ),
        repeating-linear-gradient(
            7deg,
            rgba(91,49,20,.05) 0px,
            rgba(91,49,20,.05) 2px,
            transparent 2px,
            transparent 14px
        ),
        repeating-linear-gradient(
            9deg,
            rgba(255,226,179,.05) 0px,
            rgba(255,226,179,.05) 1px,
            transparent 1px,
            transparent 18px
        ),
        linear-gradient(
            145deg,
            #d7a56b 0%,
            #c38b52 28%,
            #b87940 55%,
            #9a6032 78%,
            #75441f 100%
        );

    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    border-radius:32px;
    color:#fff;
    border:1px solid rgba(255,220,170,.35);
    box-shadow:
        0 25px 55px rgba(0,0,0,.65),
        inset 0 0 70px rgba(72,36,13,.25);
}

.game-container::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,239,205,.20),
            transparent 55%
        );
    pointer-events:none;
    z-index:0;
}

.game-container::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 55%,
            rgba(82,43,17,.05) 78%,
            rgba(47,23,8,.16) 100%
        );
    pointer-events:none;
    z-index:1;
}

.header-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px 10px;
    font-size:16px;
    font-weight:600;
    color:#3d2513;
    background:rgba(255,235,204,.18);
    backdrop-filter:blur(4px);
    position:relative;
    z-index:10;
    border-bottom:1px solid rgba(92,49,19,.12);
}

.header-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:15px;
    font-weight:800;
    color:#4b2b14;
    text-shadow:0 1px 1px rgba(255,255,255,.35);
}

.stats-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px 12px;
    background:rgba(92,48,18,.10);
    position:relative;
    z-index:10;
}

.heart-badge{
    background:linear-gradient(135deg, #ef5350, #c62828);
    padding:5px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:12px;
    color:#fff;
    box-shadow:0 4px 10px rgba(70,25,5,.35);
    border:1px solid rgba(255,255,255,.25);
}

.stat-item{
    font-size:11px;
    font-weight:700;
    color:#4b2b14;
    background:rgba(255,235,204,.42);
    padding:5px 10px;
    border-radius:12px;
    border:1px solid rgba(92,49,19,.13);
    box-shadow:inset 0 1px rgba(255,255,255,.35);
}

.table-area{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

.rope-medallion{
    width:230px;
    height:230px;
    position:absolute;
    pointer-events:none;
}

.bottle{
    width:34px;
    height:109px;
    position:absolute;
    transform:rotate(45deg);
    filter:drop-shadow(0 10px 14px rgba(45,22,7,.5));
    z-index:20;
    transition:transform 3s cubic-bezier(.15,.85,.15,1);
    cursor:pointer;
}

.spin-label{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:15px;
    font-weight:800;
    letter-spacing:3px;
    color:rgba(75,43,20,.16);
    pointer-events:none;
    z-index:4;
}

.players-container{
    width:350px;
    height:350px;
    position:relative;
    z-index:10;
}

.player{
    position:absolute;
    width:56px;
    height:56px;
    border-radius:18px;
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    box-shadow:0 6px 14px rgba(58,29,9,.45);
    border:2px solid rgba(255,255,255,.45);
    z-index:10;
}

.player.pink{ border-color:#ff4081; box-shadow:0 0 10px rgba(255,64,129,.35); }
.player.blue{ border-color:#00bcd4; box-shadow:0 0 10px rgba(0,188,212,.35); }
.player.gold{ border-color:#d79b00; box-shadow:0 0 10px rgba(215,155,0,.35); }

.player.winner{
    animation: winnerPulse 1s ease-in-out infinite;
    box-shadow:
        0 0 0 4px rgba(255,215,0,.55),
        0 0 22px rgba(255,215,0,.75);
    z-index: 25;
}

@keyframes winnerPulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.player-name{
    position:absolute;
    bottom:-19px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    white-space:nowrap;
    max-width:80px;
    overflow:hidden;
    text-overflow:ellipsis;
    z-index:15;
}

.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    background:linear-gradient(135deg, #ff9800, #ed6c02);
    color:#fff;
    font-size:9.5px;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:800;
    border:1.5px solid #5a3216;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
    z-index:20;
}

.chat-section{
    background:#ffffff;
    color:#111;
    border-top-left-radius:28px;
    border-top-right-radius:28px;
    height:290px;
    display:flex;
    flex-direction:column;
    padding:16px 18px;
    box-shadow:0 -10px 30px rgba(45,21,7,.45);
    border-top:1px solid rgba(0,0,0,.08);
    z-index:30;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.08);
    font-weight:600;
    font-size:13px;
    color:rgba(0,0,0,.7);
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px 0;
}

.chat-item{ display:flex; align-items:flex-start; gap:10px; }

.chat-avatar{
    width:32px;
    height:32px;
    border-radius:10px;
    background-size:cover;
    flex-shrink:0;
}

.chat-username{
    font-weight:700;
    font-size:11px;
    color:rgba(0,0,0,.55);
    margin-bottom:2px;
}

.chat-bubble{
    background:rgba(0,0,0,.04);
    padding:8px 12px;
    border-radius:4px 14px 14px 14px;
    font-size:12px;
    color:#111;
    border:1px solid rgba(0,0,0,.06);
    line-height:1.3;
}

.chat-input-area{ display:flex; align-items:center; gap:10px; padding-top:8px; }

.chat-input{
    flex:1;
    background:rgba(0,0,0,.04);
    border:1px solid rgba(0,0,0,.12);
    padding:10px 16px;
    border-radius:20px;
    outline:none;
    font-size:12px;
    color:#111;
}

.chat-input::placeholder{ color:rgba(0,0,0,.35); }

.send-btn{
    background:linear-gradient(135deg, #2b2b2b, #000);
    color:#fff;
    border:none;
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

@media (max-width: 380px) {
    .game-container{ border-radius:0; }
    .rope-medallion{ width:200px; height:200px; }
    .players-container{ width:310px; height:310px; }
    .player{ width:52px; height:52px; }
}

</style>
</head>


<body>

<div class="game-container">

    <div class="header-nav">
        <span style="cursor:pointer;" onclick="closeGame()">✕</span>

        <div class="header-title">
            Spin the Bottle 🍾
        </div>

        <span style="cursor:pointer;">⋮</span>
    </div>


    <div class="stats-bar">

        <div class="heart-badge">
            ❤️ 10,000
        </div>

        <div class="stat-item">
            🎟️ 8 d.
        </div>

        <div class="stat-item">
            🎯 #
        </div>

        <div class="stat-item">
            ⚙️
        </div>

        <div class="stat-item">
            Table 229 🔄
        </div>

    </div>


    <div class="table-area">

        <svg class="rope-medallion" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="medFill" cx="50%" cy="45%" r="60%">
                    <stop offset="0%" stop-color="rgba(255,230,188,.22)"/>
                    <stop offset="60%" stop-color="rgba(182,117,58,.10)"/>
                    <stop offset="100%" stop-color="rgba(182,117,58,0)"/>
                </radialGradient>
            </defs>

            <circle cx="120" cy="120" r="112" fill="url(#medFill)"/>

            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(88,48,18,.30)" stroke-width="6"/>

            <circle cx="120" cy="120" r="92" fill="none" stroke="rgba(88,48,18,.22)" stroke-width="1.5"/>

            <circle cx="120" cy="120" r="46" fill="rgba(255,235,198,.16)" stroke="rgba(255,235,198,.30)" stroke-width="1"/>
        </svg>

        <div class="spin-label">UZB</div>

        <svg
            class="bottle"
            id="bottle"
            onclick="spinBottle()"
            viewBox="0 0 100 320"
            xmlns="http://www.w3.org/2000/svg">

            <defs>
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"  stop-color="#021508"/>
                    <stop offset="10%" stop-color="#083a14"/>
                    <stop offset="22%" stop-color="#0f5c1e"/>
                    <stop offset="34%" stop-color="#1f9330"/>
                    <stop offset="44%" stop-color="#4bc457"/>
                    <stop offset="50%" stop-color="#7fe887"/>
                    <stop offset="56%" stop-color="#4bc457"/>
                    <stop offset="66%" stop-color="#1f9330"/>
                    <stop offset="78%" stop-color="#0f5c1e"/>
                    <stop offset="90%" stop-color="#083a14"/>
                    <stop offset="100%" stop-color="#021508"/>
                </linearGradient>

                <linearGradient id="glassGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"  stop-color="#010c04"/>
                    <stop offset="15%" stop-color="#062c0e"/>
                    <stop offset="50%" stop-color="#0b4315"/>
                    <stop offset="85%" stop-color="#062c0e"/>
                    <stop offset="100%" stop-color="#010c04"/>
                </linearGradient>
            </defs>

            <path
                fill="url(#glassGrad)"
                fill-opacity="0.94"
                d="M38,0
                   L62,0
                   L62,14
                   Q63,16 63,20
                   L63,96
                   Q63,116 78,128
                   Q94,141 94,166
                   L94,292
                   Q94,306 79,310
                   Q65,314 50,314
                   Q35,314 21,310
                   Q6,306 6,292
                   L6,166
                   Q6,141 22,128
                   Q37,116 37,96
                   L37,20
                   Q37,16 38,14
                   Z"
            />

            <rect x="38" y="0" width="24" height="6" fill="url(#glassGradDark)"/>

            <ellipse cx="34" cy="185" rx="7" ry="70" fill="rgba(255,255,255,0.42)" opacity="0.5"/>

            <path d="M28,60 L28,300" stroke="rgba(255,255,255,0.55)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

            <path d="M80,130 Q88,200 86,296" stroke="rgba(0,0,0,0.35)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>

            <path
                fill="none"
                stroke="rgba(0,0,0,0.35)"
                stroke-width="1.5"
                d="M38,0
                   L62,0
                   L62,14
                   Q63,16 63,20
                   L63,96
                   Q63,116 78,128
                   Q94,141 94,166
                   L94,292
                   Q94,306 79,310
                   Q65,314 50,314
                   Q35,314 21,310
                   Q6,306 6,292
                   L6,166
                   Q6,141 22,128
                   Q37,116 37,96
                   L37,20
                   Q37,16 38,14
                   Z"
            />

            <ellipse cx="50" cy="314" rx="38" ry="5" fill="rgba(0,0,0,0.25)"/>
        </svg>

        <div
            class="players-container"
            id="playersContainer">
        </div>

    </div>


    <div class="chat-section">

        <div class="chat-header">
            <span>💬 O'yin chati</span>
        </div>


        <div class="chat-messages" id="chatMessages">

            <div class="chat-item">

                <div
                    class="chat-avatar"
                    style="background-image:url('https://i.pravatar.cc/150?img=1');">
                </div>

                <div>

                    <div class="chat-username">
                        Aziza 👑
                    </div>

                    <div class="chat-bubble">
                        Salom hammaga! 👋
                    </div>

                </div>

            </div>


            <div class="chat-item">

                <div
                    class="chat-avatar"
                    style="background-image:url('https://i.pravatar.cc/150?img=12');">
                </div>

                <div>

                    <div class="chat-username">
                        Bekzod ✔
                    </div>

                    <div class="chat-bubble">
                        O'yinni boshlaymizmi? 🔥
                    </div>

                </div>

            </div>

        </div>


        <div class="chat-input-area">

            <input
                id="chatInput"
                type="text"
                class="chat-input"
                placeholder="Xabar yozing..."
                onkeydown="if(event.key==='Enter') sendMessage();"
            >

            <button class="send-btn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

const players = [

    {
        name:"Aziza",
        img:"https://i.pravatar.cc/150?img=1",
        badge:4,
        type:"gold"
    },

    {
        name:"Malika 👑",
        img:"https://i.pravatar.cc/150?img=2",
        badge:2,
        type:"pink"
    },

    {
        name:"Sevinchbekova",
        img:"https://i.pravatar.cc/150?img=3",
        badge:1,
        type:"pink"
    },

    {
        name:"Gulnoza",
        img:"https://i.pravatar.cc/150?img=4",
        badge:1,
        type:"pink"
    },

    {
        name:"Nilufar",
        img:"https://i.pravatar.cc/150?img=5",
        badge:5,
        type:"pink"
    },

    {
        name:"Fazliddin",
        img:"https://i.pravatar.cc/150?img=6",
        badge:5,
        type:"blue"
    },

    {
        name:"Dildora",
        img:"https://i.pravatar.cc/150?img=7",
        badge:5,
        type:"pink"
    },

    {
        name:"Sardorbek ✔",
        img:"https://i.pravatar.cc/150?img=8",
        badge:1,
        type:"blue"
    },

    {
        name:"Madina",
        img:"https://i.pravatar.cc/150?img=9",
        badge:1,
        type:"gold"
    },

    {
        name:"Jasurbek ✔",
        img:"https://i.pravatar.cc/150?img=10",
        badge:1,
        type:"blue"
    },

    {
        name:"Madina",
        img:"https://i.pravatar.cc/150?img=11",
        badge:1,
        type:"pink"
    },

    {
        name:"Bekzod ✔",
        img:"https://i.pravatar.cc/150?img=12",
        badge:1,
        type:"blue"
    }

];


function renderPlayers(){

    const container =
        document.getElementById("playersContainer");

    container.innerHTML="";

    const total=players.length;

    const radius=150;

    const avatarSize=56;

    const centerOffset=
        165-(avatarSize/2);


    players.forEach((player,index)=>{

        const angleDeg=
            (index*(360/total))-360;

        const angleRad=
            angleDeg*(Math.PI/180);


        let x=
            centerOffset+
            radius*Math.cos(angleRad)+12;

        let y=
            centerOffset+
            radius*Math.sin(angleRad);


        if(player.name.includes("Gulnoza")){
            x-=8;
        }

        if(player.name.includes("Sevinch")){
            x-=12;
        }


        const playerEl=
            document.createElement("div");


        playerEl.className=
            `player ${player.type}`;


        playerEl.style.backgroundImage=
            `url('${player.img}')`;


        playerEl.style.left=
            `${x}px`;


        playerEl.style.top=
            `${y}px`;


        playerEl.innerHTML=`

            <span class="badge">
                ${player.badge}
            </span>

            <span
                class="player-name"
                title="${player.name}">
                ${player.name}
            </span>

        `;


        playerEl.dataset.angle =
            (((angleDeg % 360) + 360) % 360).toFixed(2);

        container.appendChild(playerEl);

    });

}


let currentRotation=45;
let isSpinning=false;


function spinBottle(){

    if(isSpinning) return;
    isSpinning=true;

    const bottle=
        document.getElementById("bottle");

    document.querySelectorAll(".player.winner")
        .forEach(el => el.classList.remove("winner"));

    const extraDegrees=
        Math.floor(Math.random()*360)+1440;

    currentRotation+=extraDegrees;

    bottle.style.transform=
        `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        isSpinning=false;

        const neckAngle = ((270 + currentRotation) % 360 + 360) % 360;

        let closestEl = null;
        let closestDiff = 361;

        document.querySelectorAll(".player").forEach(el => {
            const a = parseFloat(el.dataset.angle);
            let diff = Math.abs(a - neckAngle);
            if (diff > 180) diff = 360 - diff;
            if (diff < closestDiff) {
                closestDiff = diff;
                closestEl = el;
            }
        });

        if (closestEl) {
            closestEl.classList.add("winner");
        }
    }, 3100);

}


renderPlayers();

function closeGame(){
    if(confirm("O'yindan chiqmoqchimisiz?")){
        document.body.innerHTML =
            "<div style='color:#fff;font-size:16px;text-align:center;margin-top:40vh;'>O'yindan chiqildi</div>";
    }
}

function sendMessage(){
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if(!text) return;

    const messages = document.getElementById("chatMessages");

    const item = document.createElement("div");
    item.className = "chat-item";
    item.innerHTML = `
        <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=13');"></div>
        <div>
            <div class="chat-username">Siz</div>
            <div class="chat-bubble">${text.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
        </div>
    `;

    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    input.value = "";
}

</script>

</body>
</html>
