<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin the Bottle - Full Wood Table</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
}

body {
    background: #080504;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.game-container {
    width: 100%;
    max-width: 414px;
    height: 100vh;
    max-height: 896px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    color: #fff;
    box-shadow: 0 25px 55px rgba(0,0,0,.85);
    /* BUTUN FONGA YOG'OCH TEKSTURA */
    background: 
        repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.08) 0px,
            rgba(255, 255, 255, 0.03) 2px,
            rgba(0, 0, 0, 0.05) 5px,
            rgba(0, 0, 0, 0.12) 10px
        ),
        linear-gradient(180deg, #7c4822 0%, #633616 50%, #4a270e 100%);
}

/* HEADER & STATS */
.stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px 10px;
    position: relative;
    z-index: 10;
}

.heart-badge {
    background: #932c2c;
    padding: 6px 14px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.4);
}

.stat-item {
    font-size: 12px;
    font-weight: 700;
    color: #e3c4a8;
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 14px;
    border-radius: 14px;
    backdrop-filter: blur(4px);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
}

/* STOL MAYDONI */
.table-area {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    overflow: hidden;
}

/* STOLDAGI O'YMA AYLANA VA KOMPAS NAQSHLARI */
.uzb-table-design {
    position: absolute;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ring-outer {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(40, 18, 5, 0.65);
    box-shadow: inset 0 0 4px rgba(0,0,0,0.5), 0 1px 1px rgba(255,255,255,0.1);
}

.ring-middle {
    position: absolute;
    width: 82%; height: 82%;
    border-radius: 50%;
    border: 2px solid rgba(40, 18, 5, 0.6);
    box-shadow: inset 0 0 3px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.08);
}

.ring-inner {
    position: absolute;
    width: 64%; height: 64%;
    border-radius: 50%;
    border: 2px solid rgba(40, 18, 5, 0.6);
}

.compass {
    position: absolute;
    width: 48%; height: 48%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.star {
    position: absolute;
    width: 100%; height: 100%;
}

.star::before, .star::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    transform-origin: center;
    background: linear-gradient(to right, transparent 0%, rgba(35, 15, 4, 0.75) 49%, transparent 50%);
    clip-path: polygon(50% 0%, 57% 43%, 100% 50%, 57% 57%, 50% 100%, 43% 57%, 0% 50%, 43% 43%);
}

.star::before { width: 100%; height: 100%; transform: translate(-50%, -50%); }
.star::after { width: 100%; height: 100%; transform: translate(-50%, -50%) rotate(45deg); }

/* BUTILKA SHISHASI */
.bottle {
    width: 36px;
    height: 110px;
    position: absolute;
    left: calc(50% - 18px);
    top: calc(50% - 55px);
    transform-origin: 50% 50%;
    transform: rotate(0deg);
    filter: drop-shadow(0 12px 16px rgba(0,0,0,0.75));
    z-index: 20;
    transition: transform 3.2s cubic-bezier(.1,.85,.15,1);
    cursor: pointer;
}

/* O'YINCHILAR RO'YXATI */
.players-container {
    width: 360px;
    height: 360px;
    position: relative;
    z-index: 10;
}

.player {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    box-shadow: 0 6px 14px rgba(0,0,0,0.6);
    border: 2px solid #a6844c;
    z-index: 10;
    transition: transform 0.2s ease;
    cursor: pointer;
}

.player.active-glow {
    border-color: #55ff77;
    box-shadow: 0 0 12px #39c958;
}

.player.is-me {
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
}

.player-name-box {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
    z-index: 15;
}

.player-flag {
    font-size: 9px;
    font-weight: 700;
    color: #e0c8b3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}

.player-name {
    font-size: 9px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
</style>
</head>

<body>

<div class="game-container">

    <div class="stats-bar">
        <div class="heart-badge">❤️ 10,000</div>
        <div class="stat-item">🎟️ 8</div>
        <div class="stat-item">TABLE #229</div>
    </div>

    <div class="table-area">
        
        <div class="uzb-table-design">
            <div class="ring-outer"></div>
            <div class="ring-middle"></div>
            <div class="ring-inner"></div>
            <div class="compass">
                <div class="star"></div>
            </div>
        </div>

        <svg class="bottle" id="bottle" onclick="spinBottle()" viewBox="0 0 100 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#072b11"/>
                    <stop offset="30%" stop-color="#185c29"/>
                    <stop offset="60%" stop-color="#2c8a42"/>
                    <stop offset="85%" stop-color="#185c29"/>
                    <stop offset="100%" stop-color="#072b11"/>
                </linearGradient>
                <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ab9461"/>
                    <stop offset="50%" stop-color="#ebd8ad"/>
                    <stop offset="100%" stop-color="#ab9461"/>
                </linearGradient>
            </defs>
            <path fill="url(#glassGrad)" fill-opacity="0.98" d="M32,0 L68,0 L68,14 Q69,16 69,20 L69,64 Q69,86 82,100 Q96,116 96,140 L96,292 Q96,306 79,310 Q65,314 50,314 Q35,314 21,310 Q4,306 4,292 L4,140 Q4,116 18,100 Q31,86 31,64 L31,20 Q31,16 32,14 Z" />
            <rect x="14" y="150" width="72" height="135" rx="4" fill="url(#labelGrad)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
            <text x="50" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#2d1c07" letter-spacing="1">SPIN THE</text>
            <text x="50" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#2d1c07" letter-spacing="1.2">BOTTLE</text>
            <ellipse cx="26" cy="60" rx="3" ry="28" fill="rgba(255,255,255,0.2)"/>
        </svg>

        <div class="players-container" id="playersContainer"></div>
    </div>

</div>

<script>
const players = [
    { id: 1, name:"Muhammad", flag:"uz", img:"https://i.pravatar.cc/150?img=13", isMe: true },
    { id: 2, name:"Elizabeth", flag:"us", img:"https://i.pravatar.cc/150?img=1", isMe: true },
    { id: 3, name:"Maximilian", flag:"de", img:"https://i.pravatar.cc/150?img=12" },
    { id: 4, name:"Sora", flag:"jp", img:"https://i.pravatar.cc/150?img=5" },
    { id: 5, name:"Alejandro", flag:"es", img:"https://i.pravatar.cc/150?img=6" },
    { id: 6, name:"Chloe", flag:"fr", img:"https://i.pravatar.cc/150?img=9" },
    { id: 7, name:"Abdurahmon", flag:"ae", img:"https://i.pravatar.cc/150?img=11" },
    { id: 8, name:"Anna", flag:"gb", img:"https://i.pravatar.cc/150?img=16" },
    { id: 9, name:"Lucas", flag:"br", img:"https://i.pravatar.cc/150?img=8", active: true },
    { id: 10, name:"Sofia", flag:"it", img:"https://i.pravatar.cc/150?img=2", active: true },
    { id: 11, name:"Dmitry", flag:"kz", img:"https://i.pravatar.cc/150?img=15" },
    { id: 12, name:"Zara", flag:"tr", img:"https://i.pravatar.cc/150?img=10" }
];

function renderPlayers(){
    const container = document.getElementById("playersContainer");
    if(!container) return;
    container.innerHTML = "";

    const total = players.length;
    const containerWidth = container.offsetWidth || 360;
    const avatarSize = 46;
    const radius = (containerWidth / 2) - (avatarSize / 2) - 6; 
    const center = containerWidth / 2;

    players.forEach((player, index) => {
        const angleDeg = (index * (360 / total)) - 90; 
        const angleRad = angleDeg * (Math.PI / 180);

        const x = center + radius * Math.cos(angleRad) - (avatarSize / 2);
        const y = center + radius * Math.sin(angleRad) - (avatarSize / 2);

        const playerEl = document.createElement("div");
        
        let classNames = "player";
        if (player.active) classNames += " active-glow";
        if (player.isMe) classNames += " is-me";
        
        playerEl.className = classNames;
        playerEl.style.backgroundImage = `url('${player.img}')`;
        playerEl.style.left = `${x}px`;
        playerEl.style.top = `${y}px`;
        playerEl.dataset.id = player.id;

        playerEl.innerHTML = `
            <div class="player-name-box">
                <span class="player-flag">${player.flag}</span>
                <span class="player-name">${player.name}</span>
            </div>
        `;

        let normalizedAngle = ((angleDeg % 360) + 360) % 360;
        playerEl.dataset.angle = normalizedAngle.toFixed(2);
        container.appendChild(playerEl);
    });
}

let currentRotation = 0;
let isSpinning = false;

function spinBottle(){
    if(isSpinning) return;
    isSpinning = true;

    const bottle = document.getElementById("bottle");

    const randomIndex = Math.floor(Math.random() * players.length);
    const targetPlayer = players[randomIndex];
    const targetEl = document.querySelector(`.player[data-id="${targetPlayer.id}"]`);
    
    const targetAngle = parseFloat(targetEl.dataset.angle);
    const targetNeckAngle = (targetAngle + 90) % 360;
    const currentModulo = currentRotation % 360;
    
    let diff = targetNeckAngle - currentModulo;
    if (diff < 0) diff += 360;

    currentRotation = currentRotation + 1440 + diff;
    bottle.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        isSpinning = false;
    }, 3200);
}

document.addEventListener("DOMContentLoaded", renderPlayers);
</script>

</body>
</html>
