<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Bottle</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #151515;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

.title {
    font-size: 30px;
    margin-bottom: 25px;
    font-weight: bold;
}

/* STOL */
.table {
    position: relative;
    width: min(88vw, 600px);
    height: min(88vw, 600px);
    margin: auto;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 45%,
            #b96d35 0%,
            #8b4b23 55%,
            #542a14 100%
        );

    border: 18px solid #28130a;

    box-shadow:
        0 25px 60px rgba(0,0,0,.65),
        inset 0 0 35px rgba(0,0,0,.5);
}

/* stol ichidagi doira */
.table::before {
    content: "";
    position: absolute;
    inset: 35px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.12);
}

/* O'YINCHILAR */
.player {
    position: absolute;
    width: 88px;
    height: 88px;

    border-radius: 50%;

    background: #202938;
    border: 4px solid #718096;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 14px;
    font-weight: bold;

    z-index: 20;

    box-shadow:
        0 8px 18px rgba(0,0,0,.5);

    transition:
        transform .3s,
        background .3s,
        box-shadow .3s;
}

.player.active {
    background: #16a34a;
    border-color: #bbf7d0;

    box-shadow:
        0 0 15px #22c55e,
        0 0 35px #22c55e;

    transform: scale(1.2);
}

/* joylashuv */
.player1 {
    left: 50%;
    top: -25px;
    transform: translateX(-50%);
}

.player2 {
    right: -25px;
    top: 50%;
    transform: translateY(-50%);
}

.player3 {
    left: 50%;
    bottom: -25px;
    transform: translateX(-50%);
}

.player4 {
    left: -25px;
    top: 50%;
    transform: translateY(-50%);
}

/* markaz */
.center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 250px;

    transform: translate(-50%, -50%);

    display: flex;
    justify-content: center;
    align-items: center;
}

/* BUTILKA */
.bottle {
    position: relative;

    width: 210px;
    height: 70px;

    cursor: pointer;

    transform-origin: center;

    z-index: 10;

    filter: drop-shadow(0 8px 7px rgba(0,0,0,.5));

    transition: filter .2s;
}

.bottle:hover {
    filter:
        drop-shadow(0 8px 7px rgba(0,0,0,.5))
        brightness(1.08);
}

/* shisha tanasi */
.body {
    position: absolute;

    right: 15px;
    top: 12px;

    width: 125px;
    height: 46px;

    border-radius: 24px 16px 16px 24px;

    background:
        linear-gradient(
            to bottom,
            #e5e7eb,
            #94a3b8 45%,
            #475569 52%,
            #dbeafe
        );

    border: 3px solid #263445;
}

/* butilka bo'yni */
.neck {
    position: absolute;

    left: 42px;
    top: 22px;

    width: 70px;
    height: 26px;

    background:
        linear-gradient(
            to bottom,
            #f1f5f9,
            #94a3b8
        );

    border: 3px solid #263445;
    border-right: none;
}

/* butilka og'zi */
.mouth {
    position: absolute;

    left: 22px;
    top: 18px;

    width: 30px;
    height: 34px;

    border-radius: 7px;

    background: #e2e8f0;

    border: 4px solid #263445;
}

/* markazdagi belgi */
.bottle::after {
    content: "🍾";

    position: absolute;

    right: 55px;
    top: 19px;

    font-size: 28px;

    pointer-events: none;
}

/* aylanish */
.bottle.spin {
    animation: bottleSpin 3.5s cubic-bezier(.08,.7,.18,1);
}

@keyframes bottleSpin {

    0% {
        transform: rotate(0deg);
    }

    20% {
        transform: rotate(900deg);
    }

    45% {
        transform: rotate(1800deg);
    }

    70% {
        transform: rotate(2700deg);
    }

    88% {
        transform: rotate(3150deg);
    }

    100% {
        transform: rotate(3240deg);
    }
}

/* natija */
.result {
    margin-top: 25px;

    font-size: 23px;
    font-weight: bold;

    min-height: 32px;
}

.hint {
    margin-top: 8px;

    color: #a3a3a3;

    font-size: 14px;
}

/* telefon */
@media (max-width: 500px) {

    .title {
        font-size: 24px;
        margin-bottom: 15px;
    }

    .table {
        width: 86vw;
        height: 86vw;
        border-width: 12px;
    }

    .player {
        width: 67px;
        height: 67px;
        font-size: 11px;
    }

    .player1 {
        top: -20px;
    }

    .player2 {
        right: -20px;
    }

    .player3 {
        bottom: -20px;
    }

    .player4 {
        left: -20px;
    }

    .center {
        width: 190px;
        height: 190px;
    }

    .bottle {
        transform: scale(.72);
    }

    .result {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="title">
        🍾 SPIN BOTTLE
    </div>

    <div class="table">

        <div class="player player1" data-player="1">
            PLAYER 1
        </div>

        <div class="player player2" data-player="2">
            PLAYER 2
        </div>

        <div class="player player3" data-player="3">
            PLAYER 3
        </div>

        <div class="player player4" data-player="4">
            PLAYER 4
        </div>

        <div class="center">

            <div class="bottle" id="bottle">

                <div class="mouth"></div>
                <div class="neck"></div>
                <div class="body"></div>

            </div>

        </div>

    </div>

    <div class="result" id="result">
        🍾 Butilkaga bosing
    </div>

    <div class="hint">
        Butilka o'ziga bosib aylantiring
    </div>

</div>

<script>

const bottle = document.getElementById("bottle");

const players =
    document.querySelectorAll(".player");

const result =
    document.getElementById("result");

let spinning = false;

bottle.addEventListener("click", function () {

    if (spinning) return;

    spinning = true;

    players.forEach(function(player) {
        player.classList.remove("active");
    });

    result.textContent = "🔄 Butilka aylanmoqda...";

    bottle.classList.remove("spin");

    void bottle.offsetWidth;

    bottle.classList.add("spin");

    /*
       4 o'yinchidan bittasini
       tasodifiy tanlaymiz
    */

    const winner =
        Math.floor(Math.random() * 4) + 1;

    setTimeout(function () {

        bottle.classList.remove("spin");

        const player =
            document.querySelector(
                '[data-player="' + winner + '"]'
            );

        player.classList.add("active");

        result.textContent =
            "🎯 PLAYER " + winner + " TANLANDI!";

        spinning = false;

    }, 3500);

});

</script>

</body>
</html>
