<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Bottle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            height: 900px;
            background: #2b1704 url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-size: cover;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
            color: #fff;
        }

        /* Top Header Navigation */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 600;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 12px;
        }

        .heart-badge {
            background: #ff4d4d;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        /* Table Playing Area */
        .table-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 215, 0, 0.4);
            position: absolute;
        }

        .bottle {
            width: 45px;
            height: 130px;
            background: linear-gradient(135deg, #1b5e20, #4caf50);
            border-radius: 20px 20px 8px 8px;
            position: absolute;
            transform: rotate(45deg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 2;
        }

        /* Mukammal teng doiraviy joylashuv mexanizmi */
        .players-circle {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 50%;
        }

        .player {
            --angle: calc(var(--i) * 30deg - 90deg); /* 12 o'yinchi: 360/12 = 30deg */
            --radius: 145px; /* Markazdan masofasi */
            position: absolute;
            top: 50%;
            left: 50%;
            width: 52px;
            height: 52px;
            margin: -26px; /* Element markazlashtirishi */
            transform: rotate(var(--angle)) translate(var(--radius)) rotate(calc(-1 * var(--angle)));
            border-radius: 50%;
            border: 2.5px solid #ff007f;
            box-shadow: 0 0 8px #ff007f;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Unikal chegaralar (border rangi va foni) */
        .player.gold { border-color: #ffd700; box-shadow: 0 0 8px #ffd700; }
        .player.blue { border-color: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
        .player.orange { border-color: #ff9200; box-shadow: 0 0 8px #ff9200; }

        .player-name {
            position: absolute;
            bottom: -20px;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff9800;
            color: #fff;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 1px solid #fff;
        }

        /* Chat Section */
        .chat-section {
            background: #ffffff;
            color: #333;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            height: 320px;
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }

        .chat-bubble {
            background: #f1f2f6;
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-username {
            font-weight: bold;
            font-size: 12px;
            color: #222;
        }

        .chat-time {
            font-size: 10px;
            color: #aaa;
            margin-left: auto;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
        }

        .chat-input {
            flex: 1;
            background: #f1f2f6;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
        }

        .send-btn {
            background: #000;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Top Bar -->
    <div class="header-nav">
        <span>✕</span>
        <div>Spin the Bottle 🍾❤️</div>
        <span>⋮</span>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="heart-badge">❤️ 143</div>
        <div class="stat-item">🎟️ 8 d.</div>
        <div class="stat-item">🎯 #5 (1 hr.)</div>
        <div class="stat-item">⚙️</div>
        <div class="stat-item">Table 229 🔄</div>
    </div>

    <!-- Playing Area -->
    <div class="table-area">
        <div class="center-circle"></div>
        <div class="bottle"></div>

        <!-- O'yinchilar teng masofada (--i tartib raqami yordamida) -->
        <div class="players-circle">
            <div class="player gold" style="--i: 0; background-image: url('https://i.pravatar.cc/100?img=1');"><span class="badge">4</span><span class="player-name">Aziza</span></div>
            <div class="player" style="--i: 1; background-image: url('https://i.pravatar.cc/100?img=2');"><span class="badge">2</span><span class="player-name">Malika 👑</span></div>
            <div class="player" style="--i: 2; background-image: url('https://i.pravatar.cc/100?img=3');"><span class="badge">1</span><span class="player-name">Sevinch</span></div>
            <div class="player" style="--i: 3; background-image: url('https://i.pravatar.cc/100?img=4');"><span class="badge">1</span><span class="player-name">Gulnoza</span></div>
            <div class="player" style="--i: 4; background-image: url('https://i.pravatar.cc/100?img=5');"><span class="badge">5</span><span class="player-name">Nilufar</span></div>
            <div class="player blue" style="--i: 5; background-image: url('https://i.pravatar.cc/100?img=6');"><span class="badge">5</span><span class="player-name">Fazliddin</span></div>
            <div class="player" style="--i: 6; background-image: url('https://i.pravatar.cc/100?img=7');"><span class="badge">5</span><span class="player-name">Dildora</span></div>
            <div class="player blue" style="--i: 7; background-image: url('https://i.pravatar.cc/100?img=8');"><span class="badge">1</span><span class="player-name">Sardor ✔</span></div>
            <div class="player orange" style="--i: 8; background-image: url('https://i.pravatar.cc/100?img=9');"><span class="badge">1</span><span class="player-name">Madina</span></div>
            <div class="player blue" style="--i: 9; background-image: url('https://i.pravatar.cc/100?img=10');"><span class="badge">1</span><span class="player-name">Jasur ✔</span></div>
            <div class="player" style="--i: 10; background-image: url('https://i.pravatar.cc/100?img=11');"><span class="badge">1</span><span class="player-name">Madina</span></div>
            <div class="player blue" style="--i: 11; background-image: url('https://i.pravatar.cc/100?img=12');"><span class="badge">1</span><span class="player-name">Bekzod ✔</span></div>
        </div>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
        <div class="chat-header">
            <span>💬 Chat</span>
            <span>👥 12/12</span>
        </div>

        <div class="chat-messages">
            <div class="chat-item">
                <div class="chat-avatar" style="background-image: url('https://i.pravatar.cc/100?img=1');"></div>
                <div>
                    <div class="chat-username">Aziza 👑</div>
                    <div class="chat-bubble">Salom hammaga! 👋 <span class="chat-time">21:48</span></div>
                </div>
            </div>

            <div class="chat-item">
                <div class="chat-avatar" style="background-image: url('https://i.pravatar.cc/100?img=12');"></div>
                <div>
                    <div class="chat-username">Bekzod ✔</div>
                    <div class="chat-bubble">O'yin boshlaymizmi? 🔥 <span class="chat-time">21:48</span></div>
                </div>
            </div>

            <div class="chat-item">
                <div class="chat-avatar" style="background-image: url('https://i.pravatar.cc/100?img=2');"></div>
                <div>
                    <div class="chat-username">Malika 👑</div>
                    <div class="chat-bubble">Lets go 😍 <span class="chat-time">21:49</span></div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" placeholder="Xabar yozing...">
            <button class="send-btn">➤</button>
        </div>
    </div>
</div>

</body>
</html>
