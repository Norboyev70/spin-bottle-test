<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Spin the Bottle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= TOP BAR ================= -->

    <header class="topbar">

        <div class="user-box">

            <div class="user-avatar">
                <img src="https://i.pravatar.cc/100?img=12" alt="">
            </div>

            <div class="user-info">
                <strong>Norbek</strong>
                <span>Level 18</span>
            </div>

        </div>


        <div class="heart-box">

            <span class="heart">♥</span>

            <strong>11 250</strong>

        </div>

    </header>


    <!-- ================= GAME ================= -->

    <main class="game">

        <!-- ================= TABLE ================= -->

        <section class="table-area">

            <div class="table">

                <!-- PLAYER 1 -->
                <div class="player player-1">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=32" alt="">
                    </div>
                    <strong>Madina</strong>
                    <small>♥ 128</small>
                </div>


                <!-- PLAYER 2 -->
                <div class="player player-2">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=14" alt="">
                    </div>
                    <strong>Jasur</strong>
                    <small>♥ 96</small>
                </div>


                <!-- PLAYER 3 -->
                <div class="player player-3">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=47" alt="">
                    </div>
                    <strong>Malika</strong>
                    <small>♥ 214</small>
                </div>


                <!-- PLAYER 4 -->
                <div class="player player-4">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=11" alt="">
                    </div>
                    <strong>Bekzod</strong>
                    <small>♥ 74</small>
                </div>


                <!-- PLAYER 5 -->
                <div class="player player-5">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=44" alt="">
                    </div>
                    <strong>Sevinch</strong>
                    <small>♥ 183</small>
                </div>


                <!-- PLAYER 6 -->
                <div class="player player-6">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=13" alt="">
                    </div>
                    <strong>Aziz</strong>
                    <small>♥ 61</small>
                </div>


                <!-- PLAYER 7 -->
                <div class="player player-7">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=49" alt="">
                    </div>
                    <strong>Shahnoza</strong>
                    <small>♥ 302</small>
                </div>


                <!-- PLAYER 8 -->
                <div class="player player-8">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=8" alt="">
                    </div>
                    <strong>Sardor</strong>
                    <small>♥ 119</small>
                </div>


                <!-- PLAYER 9 -->
                <div class="player player-9">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=25" alt="">
                    </div>
                    <strong>Zarina</strong>
                    <small>♥ 246</small>
                </div>


                <!-- PLAYER 10 -->
                <div class="player player-10">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=3" alt="">
                    </div>
                    <strong>Diyor</strong>
                    <small>♥ 88</small>
                </div>


                <!-- PLAYER 11 -->
                <div class="player player-11">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=45" alt="">
                    </div>
                    <strong>Rayhona</strong>
                    <small>♥ 156</small>
                </div>


                <!-- PLAYER 12 -->
                <div class="player player-12">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=6" alt="">
                    </div>
                    <strong>Kamron</strong>
                    <small>♥ 105</small>
                </div>


                <!-- ================= BOTTLE ================= -->

                <button
                    class="bottle-button"
                    id="bottleButton"
                    aria-label="Butilkani aylantirish"
                >

                    <div class="bottle">

                        <div class="bottle-cap"></div>

                        <div class="bottle-neck">
                            <div class="shine"></div>
                        </div>

                        <div class="bottle-body">

                            <div class="bottle-light"></div>

                            <div class="bottle-label">
                                SPIN
                            </div>

                        </div>

                    </div>

                </button>

            </div>

        </section>


        <!-- ================= CHAT ================= -->

        <section class="chat">

            <div class="chat-header">

                <div>
                    <strong>Stol suhbati</strong>
                    <span>12 o‘yinchi</span>
                </div>

                <button class="more">
                    •••
                </button>

            </div>


            <div
                class="messages"
                id="messages"
            >

                <div class="message">

                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=32" alt="">
                    </div>

                    <div class="message-text">
                        <strong>Madina</strong>
                        <p>Salom hammaga ❤️</p>
                    </div>

                </div>


                <div class="message own">

                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=12" alt="">
                    </div>

                    <div class="message-text">
                        <strong>Norbek</strong>
                        <p>Qani boshladik 😎</p>
                    </div>

                </div>


                <div class="message">

                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=14" alt="">
                    </div>

                    <div class="message-text">
                        <strong>Jasur</strong>
                        <p>Kimga tusharkin? 😂</p>
                    </div>

                </div>

            </div>


            <!-- QUICK -->

            <div class="quick">

                <button>❤️</button>
                <button>😂</button>
                <button>🔥</button>
                <button>😍</button>
                <button>Voy!</button>

            </div>


            <!-- INPUT -->

            <div class="chat-input">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Xabar yozing..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    ➤
                </button>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
