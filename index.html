<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spin the Bottle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- TOP -->
    <header class="topbar">

        <div class="profile">
            <div class="profile-avatar">
                <img src="https://i.pravatar.cc/100?img=12" alt="">
            </div>

            <div>
                <b>Norbek</b>
                <small>Level 18</small>
            </div>
        </div>

        <div class="hearts">
            <span>♥</span>
            <b>11 250</b>
        </div>

    </header>


    <!-- ASOSIY QISM -->
    <main class="main">

        <!-- STOL -->
        <section class="table-area">

            <div class="game-table">

                <!-- PLAYER 1 -->
                <div class="player p1">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=32">
                    </div>
                    <b>Madina</b>
                    <small>♥ 128</small>
                </div>

                <!-- PLAYER 2 -->
                <div class="player p2">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=14">
                    </div>
                    <b>Jasur</b>
                    <small>♥ 96</small>
                </div>

                <!-- PLAYER 3 -->
                <div class="player p3">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=47">
                    </div>
                    <b>Malika</b>
                    <small>♥ 214</small>
                </div>

                <!-- PLAYER 4 -->
                <div class="player p4">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=11">
                    </div>
                    <b>Bekzod</b>
                    <small>♥ 74</small>
                </div>

                <!-- PLAYER 5 -->
                <div class="player p5">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=44">
                    </div>
                    <b>Sevinch</b>
                    <small>♥ 183</small>
                </div>

                <!-- PLAYER 6 -->
                <div class="player p6">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=13">
                    </div>
                    <b>Aziz</b>
                    <small>♥ 61</small>
                </div>

                <!-- PLAYER 7 -->
                <div class="player p7">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=49">
                    </div>
                    <b>Shahnoza</b>
                    <small>♥ 302</small>
                </div>

                <!-- PLAYER 8 -->
                <div class="player p8">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=8">
                    </div>
                    <b>Sardor</b>
                    <small>♥ 119</small>
                </div>

                <!-- PLAYER 9 -->
                <div class="player p9">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=25">
                    </div>
                    <b>Zarina</b>
                    <small>♥ 246</small>
                </div>

                <!-- PLAYER 10 -->
                <div class="player p10">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=3">
                    </div>
                    <b>Diyor</b>
                    <small>♥ 88</small>
                </div>

                <!-- PLAYER 11 -->
                <div class="player p11">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=45">
                    </div>
                    <b>Rayhona</b>
                    <small>♥ 156</small>
                </div>

                <!-- PLAYER 12 -->
                <div class="player p12">
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/100?img=6">
                    </div>
                    <b>Kamron</b>
                    <small>♥ 105</small>
                </div>


              <!-- MODERN SHISHA BUTILKA -->
<button class="bottle-button" id="bottleButton">

    <div class="modern-bottle">

        <div class="bottle-cap"></div>

        <div class="bottle-neck">
            <div class="glass-shine"></div>
        </div>

        <div class="bottle-shoulder"></div>

        <div class="bottle-body">
            <div class="glass-reflection"></div>
            <div class="bottle-label">SPIN</div>
        </div>

        <div class="bottle-bottom"></div>

    </div>

</button>

        <!-- CHAT -->
        <section class="chat">

            <div class="chat-top">
                <div>
                    <b>Stol suhbati</b>
                    <small>12 o‘yinchi</small>
                </div>

                <span>•••</span>
            </div>


            <div class="messages" id="messages">

                <div class="message">
                    <img src="https://i.pravatar.cc/60?img=32">

                    <div>
                        <b>Madina</b>
                        <p>Salom hammaga ❤️</p>
                    </div>
                </div>


                <div class="message own">
                    <img src="https://i.pravatar.cc/60?img=12">

                    <div>
                        <b>Norbek</b>
                        <p>Qani boshladik 😎</p>
                    </div>
                </div>


                <div class="message">
                    <img src="https://i.pravatar.cc/60?img=14">

                    <div>
                        <b>Jasur</b>
                        <p>Kimga tusharkin? 😂</p>
                    </div>
                </div>

            </div>


            <!-- TEZKOR XABAR -->
            <div class="quick">

                <button>❤️</button>
                <button>😂</button>
                <button>🔥</button>
                <button>😍</button>
                <button>Voy!</button>

            </div>


            <!-- INPUT -->
            <div class="chat-input">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Xabar yozing..."
                >

                <button id="sendButton">➤</button>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
