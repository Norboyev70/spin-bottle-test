<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Spin the Bottle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <!-- =========================
         GAME AREA
    ========================== -->
    <section class="game-area">

      <!-- Top bar -->
      <header class="top-bar">

        <div class="room-info">
          <div class="room-dot"></div>
          <span>TABLE 01</span>
        </div>

        <div class="balance">
          <span class="heart-icon">♥</span>
          <strong id="heartCount">11250</strong>
        </div>

      </header>


      <!-- =========================
           TABLE
      ========================== -->
      <div class="table-wrapper">

        <div class="table-shadow"></div>

        <div class="game-table">

          <!-- decorative inner surface -->
          <div class="table-surface">

            <!-- SVG decorative pattern -->
            <svg class="table-pattern"
                 viewBox="0 0 600 600"
                 xmlns="http://www.w3.org/2000/svg">

              <defs>

                <radialGradient id="patternGlow">
                  <stop offset="0%" stop-opacity=".35"/>
                  <stop offset="100%" stop-opacity="0"/>
                </radialGradient>

                <linearGradient id="goldLine"
                                x1="0"
                                y1="0"
                                x2="1"
                                y2="1">

                  <stop offset="0%" stop-opacity=".05"/>
                  <stop offset="50%" stop-opacity=".35"/>
                  <stop offset="100%" stop-opacity=".05"/>

                </linearGradient>

              </defs>

              <circle
                cx="300"
                cy="300"
                r="220"
                fill="none"
                stroke="url(#goldLine)"
                stroke-width="1"
              />

              <circle
                cx="300"
                cy="300"
                r="170"
                fill="none"
                stroke="url(#goldLine)"
                stroke-width="1"
              />

              <circle
                cx="300"
                cy="300"
                r="110"
                fill="url(#patternGlow)"
              />

              <path
                d="M300 75
                   C425 75 525 175 525 300
                   C525 425 425 525 300 525
                   C175 525 75 425 75 300
                   C75 175 175 75 300 75Z"
                fill="none"
                stroke="url(#goldLine)"
                stroke-width="1"
              />

            </svg>


            <!-- =========================
                 PLAYERS
            ========================== -->

            <div class="player player-1" data-player="1">
              <div class="avatar-frame">
                <div class="avatar">A</div>
              </div>
              <div class="player-name">Alex</div>
              <div class="kiss-count">♥ 24</div>
            </div>


            <div class="player player-2" data-player="2">
              <div class="avatar-frame">
                <div class="avatar">S</div>
              </div>
              <div class="player-name">Sara</div>
              <div class="kiss-count">♥ 18</div>
            </div>


            <div class="player player-3" data-player="3">
              <div class="avatar-frame">
                <div class="avatar">M</div>
              </div>
              <div class="player-name">Mika</div>
              <div class="kiss-count">♥ 31</div>
            </div>


            <div class="player player-4" data-player="4">
              <div class="avatar-frame">
                <div class="avatar">N</div>
              </div>
              <div class="player-name">Nora</div>
              <div class="kiss-count">♥ 12</div>
            </div>


            <div class="player player-5" data-player="5">
              <div class="avatar-frame">
                <div class="avatar">J</div>
              </div>
              <div class="player-name">James</div>
              <div class="kiss-count">♥ 27</div>
            </div>


            <div class="player player-6" data-player="6">
              <div class="avatar-frame">
                <div class="avatar">L</div>
              </div>
              <div class="player-name">Lina</div>
              <div class="kiss-count">♥ 20</div>
            </div>


            <div class="player player-7" data-player="7">
              <div class="avatar-frame">
                <div class="avatar">D</div>
              </div>
              <div class="player-name">Daniel</div>
              <div class="kiss-count">♥ 15</div>
            </div>


            <div class="player player-8" data-player="8">
              <div class="avatar-frame">
                <div class="avatar">E</div>
              </div>
              <div class="player-name">Emma</div>
              <div class="kiss-count">♥ 42</div>
            </div>


            <div class="player player-9" data-player="9">
              <div class="avatar-frame">
                <div class="avatar">K</div>
              </div>
              <div class="player-name">Kevin</div>
              <div class="kiss-count">♥ 11</div>
            </div>


            <div class="player player-10" data-player="10">
              <div class="avatar-frame">
                <div class="avatar">R</div>
              </div>
              <div class="player-name">Ruby</div>
              <div class="kiss-count">♥ 36</div>
            </div>


            <div class="player player-11" data-player="11">
              <div class="avatar-frame">
                <div class="avatar">T</div>
              </div>
              <div class="player-name">Tom</div>
              <div class="kiss-count">♥ 9</div>
            </div>


            <div class="player player-12" data-player="12">
              <div class="avatar-frame">
                <div class="avatar">V</div>
              </div>
              <div class="player-name">Vera</div>
              <div class="kiss-count">♥ 29</div>
            </div>


            <!-- =========================
                 BOTTLE
            ========================== -->

            <button
              id="bottle"
              class="bottle"
              aria-label="Spin the bottle">

              <div class="bottle-glow"></div>

              <svg viewBox="0 0 120 260"
                   xmlns="http://www.w3.org/2000/svg">

                <defs>

                  <linearGradient
                    id="glass"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

                    <stop offset="0%" stop-opacity=".35"/>
                    <stop offset="25%" stop-opacity=".05"/>
                    <stop offset="65%" stop-opacity=".25"/>
                    <stop offset="100%" stop-opacity=".03"/>

                  </linearGradient>

                  <linearGradient
                    id="bottleBody"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop offset="0%" stop-color="#183b2b"/>
                    <stop offset="45%" stop-color="#32634a"/>
                    <stop offset="100%" stop-color="#10291f"/>

                  </linearGradient>

                </defs>


                <!-- neck -->
                <path
                  d="M48 20
                     L72 20
                     L72 55
                     C72 62 84 72 87 85
                     L95 210
                     C96 228 84 242 60 244
                     C36 242 24 228 25 210
                     L33 85
                     C36 72 48 62 48 55Z"
                  fill="url(#bottleBody)"
                  stroke="#101813"
                  stroke-width="2"
                />

                <!-- glass shine -->
                <path
                  d="M43 74
                     C38 110 37 170 39 210
                     C40 225 46 233 52 236"
                  fill="none"
                  stroke="url(#glass)"
                  stroke-width="8"
                  stroke-linecap="round"
                />

                <!-- neck shine -->
                <path
                  d="M53 28 L53 62"
                  stroke="#ffffff"
                  stroke-opacity=".28"
                  stroke-width="4"
                  stroke-linecap="round"
                />

                <!-- label -->
                <rect
                  x="34"
                  y="128"
                  width="52"
                  height="55"
                  rx="5"
                  fill="#e7dcc0"
                  opacity=".94"
                />

                <text
                  x="60"
                  y="151"
                  text-anchor="middle"
                  font-size="8"
                  font-weight="700"
                  fill="#17231b">
                  SPIN
                </text>

                <text
                  x="60"
                  y="165"
                  text-anchor="middle"
                  font-size="6"
                  fill="#17231b">
                  THE
                </text>

                <text
                  x="60"
                  y="176"
                  text-anchor="middle"
                  font-size="8"
                  font-weight="700"
                  fill="#17231b">
                  BOTTLE
                </text>

              </svg>

            </button>

          </div>
        </div>
      </div>


      <!-- Current player -->
      <div class="current-player">
        <div class="current-avatar">Y</div>

        <div class="current-info">
          <strong>You</strong>
          <span>Your turn — tap the bottle</span>
        </div>

        <div class="turn-indicator"></div>
      </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <section class="chat-area">

      <header class="chat-header">

        <div>
          <strong>Table Chat</strong>
          <span>12 players</span>
        </div>

        <button class="chat-menu">•••</button>

      </header>


      <div id="messages" class="messages">

        <div class="message">
          <div class="message-avatar">S</div>

          <div class="message-content">
            <strong>Sara</strong>
            <p>Kim boshlaydi? 👀</p>
          </div>
        </div>


        <div class="message">
          <div class="message-avatar">M</div>

          <div class="message-content">
            <strong>Mika</strong>
            <p>Men tayyorman 😏</p>
          </div>
        </div>


        <div class="message own">
          <div class="message-content">
            <strong>You</strong>
            <p>Ketdik 🔥</p>
          </div>
        </div>

      </div>


      <!-- quick messages -->
      <div class="quick-messages">

        <button data-message="🔥">🔥</button>
        <button data-message="Let's go!">Let's go!</button>
        <button data-message="😏">😏</button>
        <button data-message="Wow!">Wow!</button>

      </div>


      <!-- input -->
      <form id="chatForm" class="chat-input">

        <input
          id="chatInput"
          type="text"
          maxlength="120"
          placeholder="Write a message..."
          autocomplete="off">

        <button type="submit">
          ➤
        </button>

      </form>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
