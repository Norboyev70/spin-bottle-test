<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Bottle (12 Players)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #0b0d12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-screen {
            position: relative;
            width: 390px;
            height: 780px;
            background: #1d1f27;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }
        .app-header {
            height: 48px;
            background: #171922;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: #fff;
            z-index: 30;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 17px;
            font-weight: 600;
        }
        .game-area {
            position: relative;
            height: 460px;
            width: 100%;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 75%),
                repeating-radial-gradient(circle at 50% 50%, #e8b98a 0, #e8b98a 15px, #e0ad7c 16px, #d7a171 30px);
            background-blend-mode: soft-light;
            background-color: #e0ad7c;
            overflow: hidden;
        }
        .wood-carving {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            opacity: 0.35;
        }
        .bottle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 50% 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 110px;
            height: 55px;
            z-index: 15;
            cursor: pointer;
            filter: drop-shadow(0px 10px 12px rgba(0, 0, 0, 0.6));
            transition: transform 3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease;
        }
        .players-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 390px;
            height: 390px;
            pointer-events: none;
        }
        .player-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            transition: all 0.5s ease;
            cursor: pointer;
        }
        .avatar-frame {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 12px rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.5);
            background: #111;
        }
        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-num {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #e63946;
            color: #fff;
            font-size: 9.5px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 7px;
        }
        .active-turn {
            border: 2.5px solid #00ff88 !important;
            box-shadow: 0 0 14px #00ff88 !important;
        }
        .player-info {
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
            color: #fff;
            font-size: 10.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.95);
            font-weight: 600;
        }

        .center-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 25;
            padding: 10px;
            min-width: 240px;
        }
        .center-avatars {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .center-player-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
        }
        .center-img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .center-name {
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .action-controls {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-action {
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-transform: lowercase;
        }
        .btn-kiss { background: #22c55e; }
        .btn-reject { background: #ef4444; }

        .chat-section {
            flex: 1;
            background: #14161d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px;
        }
        .chat-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            border-bottom: 1px solid #232733;
            padding-bottom: 4px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #718096;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
        }
        .tab-btn.active {
            color: #f97316;
            border-bottom: 2px solid #f97316;
        }
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            cursor: pointer;
        }
        .chat-avatar {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }
        .chat-bubble {
            background: #ffffff;
            color: #111;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11.5px;
            max-width: 250px;
        }
        .chat-bubble .sender {
            color: #2b6cb0;
            font-weight: 600;
            margin-right: 4px;
        }
        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1d212c;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .chat-input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 12px;
        }
        .send-btn {
            background: #f97316;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-screen">
    <div class="app-header">
        <span style="font-size: 18px;">✕</span>
        <div class="header-title">Spin the Bottle 🍾❤️</div>
        <div style="font-size: 16px;">⋮</div>
    </div>

    <div class="game-area">
        <div class="wood-carving" id="woodCarving"></div>
        
        <div class="bottle-wrapper" id="bottle" onclick="spin()">
            <svg viewBox="0 0 160 70" width="100%" height="100%">
                <defs>
                    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgba(30, 230, 90, 0.8)" />
                        <stop offset="100%" stop-color="rgba(20, 220, 80, 0.85)" />
                    </linearGradient>
                </defs>
                <path d="M 10,28 L 42,28 C 50,28 54,16 66,13 L 140,13 C 151,13 154,22 154,35 C 154,48 151,57 140,57 L 66,57 C 54,54 50,42 42,42 L 10,42 Z"
                      fill="url(#glassGrad)" stroke="rgba(15, 170, 65, 0.95)" stroke-width="2.2"/>
            </svg>
        </div>

        <div class="players-circle" id="playersCircle"></div>

        <div class="center-stage" id="centerStage">
            <div class="center-avatars">
                <div class="center-player-box">
                    <img id="c1Img" class="center-img" src="" alt="">
                    <span id="c1Name" class="center-name"></span>
                </div>
                <span style="font-size: 18px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">VS</span>
                <div class="center-player-box">
                    <img id="c2Img" class="center-img" src="" alt="">
                    <span id="c2Name" class="center-name"></span>
                </div>
            </div>
            <div class="action-controls" id="actionControls">
                <button class="btn-action btn-kiss" onclick="makeChoice('kiss')">kiss</button>
                <button class="btn-action btn-reject" onclick="makeChoice('refuse')">refuse</button>
            </div>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-tabs">
            <button class="tab-btn active" onclick="switchTab('general', event)">💬 Stol Chati</button>
            <button class="tab-btn" id="dmTabBtn" onclick="switchTab('dm', event)">🔒 Shaxsiy Chat</button>
        </div>

        <div class="chat-feed" id="chatFeed"></div>

        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Xabar yozing..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    const players = [
        { name: "Bobur", badge: 1, gender: "M", flag: "🇺🇿", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=100&q=80" },
        { name: "Dinara", badge: 2, gender: "F", flag: "🇰🇿", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" },
        { name: "Sardor", badge: 3, gender: "M", flag: "🇹🇷", img: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=100&q=80" },
        { name: "Madina", badge: 4, gender: "F", flag: "🇺🇦", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" },
        { name: "رمzon", badge: 5, gender: "M", flag: "🇬🇧", img: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=100&q=80" },
        { name: "Norboyev", badge: 6, gender: "M", flag: "🇩🇪", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80" },
        { name: "Isomiddin", badge: 7, gender: "M", flag: "🇰🇬", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" },
        { name: "Jasur", badge: 8, gender: "M", flag: "🇹🇯", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=80" },
        { name: "Laylo", badge: 9, gender: "F", flag: "🇯🇵", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=100&q=80" },
        { name: "Malika", badge: 10, gender: "F", flag: "🇬🇪", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" },
        { name: "Jahongir", badge: 11, gender: "M", flag: "🇦🇿", img: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=100&q=80" },
        { name: "Aziza", badge: 12, gender: "F", flag: "🇷🇺", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" }
    ];

    const container = document.getElementById('playersCircle');
    const total = players.length;
    const radiusX = 152; 
    const radiusY = 165; 
    const centerOffset = 195;
    let currentPlayerIndex = 0;
    let selectedTargetIndex = null;
    let isSpinning = false;
    let currentRotation = 0;
    let currentTab = 'general';

    let activeMatch = { p1: null, p2: null, p1Choice: null, p2Choice: null, turnStep: 1 };

    function renderPlayers() {
        container.innerHTML = '';
        players.forEach((player, i) => {
            const angle = (i * (360 / total) - 90) * (Math.PI / 180);
            let x = centerOffset + radiusX * Math.cos(angle);
            let y = centerOffset + radiusY * Math.sin(angle);

            // 12 (i===11) va 2 (i===1) bo'lgan o'yinchilarni tepaga surish
            if (player.badge === 12 || player.badge === 2) {
                y -= 14;
            }
            
            // 8 va 6 bo'lgan o'yinchilarni pastga surish
            if (player.badge === 8 || player.badge === 6) {
                y += 14;
            }

            const node = document.createElement('div');
            node.className = 'player-node';
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;
            node.style.transform = 'translate(-50%, -50%)';
            node.onclick = () => replyToUser(player.name);

            let borderClass = i === currentPlayerIndex ? 'active-turn' : '';

            node.innerHTML = `
                <div class="avatar-frame ${borderClass}">
                    <img src="${player.img}" alt="${player.name}">
                    <span class="badge-num">${player.badge}</span>
                </div>
                <div class="player-info">
                    <span>${player.flag}</span>
                    <span>${player.name}</span>
                </div>
            `;
            container.appendChild(node);
        });
    }

    renderPlayers();

    function spin() {
        if (isSpinning) return;
        isSpinning = true;

        const activePlayer = players[currentPlayerIndex];

        const validTargets = [];
        players.forEach((p, index) => {
            if (p.gender !== activePlayer.gender) {
                validTargets.push(index);
            }
        });

        selectedTargetIndex = validTargets[Math.floor(Math.random() * validTargets.length)];

        const targetAngle = (selectedTargetIndex * (360 / total)) + 90;
        const fullSpins = 1440;
        const currentMod = currentRotation % 360;
        let diff = (targetAngle - currentMod) % 360;
        if (diff < 0) diff += 360;

        currentRotation += fullSpins + diff;

        document.getElementById('bottle').style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`;

        setTimeout(() => {
            showCenterStage(activePlayer, players[selectedTargetIndex]);
        }, 3100);
    }

    function showCenterStage(p1, p2) {
        activeMatch.p1 = p1;
        activeMatch.p2 = p2;
        activeMatch.p1Choice = null;
        activeMatch.p2Choice = null;
        activeMatch.turnStep = 1;

        document.getElementById('bottle').style.display = 'none';

        document.getElementById('c1Img').src = p1.img;
        document.getElementById('c1Name').innerText = `${p1.flag} ${p1.name}`;

        document.getElementById('c2Img').src = p2.img;
        document.getElementById('c2Name').innerText = `${p2.flag} ${p2.name}`;

        document.getElementById('actionControls').style.display = 'flex';
        document.getElementById('centerStage').style.display = 'flex';
    }

    function makeChoice(type) {
        if (activeMatch.turnStep === 1) {
            activeMatch.p1Choice = type;
            activeMatch.turnStep = 2;

        } else if (activeMatch.turnStep === 2) {
            activeMatch.p2Choice = type;
            document.getElementById('actionControls').style.display = 'none';

            setTimeout(() => {
                document.getElementById('centerStage').style.display = 'none';
                document.getElementById('bottle').style.display = 'block';
                isSpinning = false;
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                renderPlayers();
            }, 1000);
        }
    }

    function replyToUser(name) {
        const input = document.getElementById('chatInput');
        input.value = `@${name} `;
        input.focus();
        document.getElementById('dmTabBtn').innerText = `🔒 DM (${name})`;
    }

    function switchTab(tab, e) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (e) e.target.classList.add('active');
        document.getElementById('chatFeed').innerHTML = '';
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        const feed = document.getElementById('chatFeed');
        const sender = players[currentPlayerIndex];

        const row = document.createElement('div');
        row.className = 'chat-row';
        row.onclick = () => replyToUser(sender.name);

        const isDM = currentTab === 'dm' ? '<b style="color:#f97316;">[DM]</b> ' : '';

        row.innerHTML = `
            <img class="chat-avatar" src="${sender.img}">
            <div class="chat-bubble">
                <span class="sender">${isDM}${sender.name}:</span> ${text}
            </div>
        `;
        feed.appendChild(row);
        input.value = '';
        feed.scrollTop = feed.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    (function drawWoodCarving() {
        const size = 300;
        const cx = size / 2, cy = size / 2;
        const petalCount = 16;
        const outerR = 140, innerR = 42;

        let petals = '';
        for (let i = 0; i < petalCount; i++) {
            const a = (i * 360 / petalCount);
            petals += `<path d="M ${cx} ${cy} 
                 L ${cx} ${cy - innerR} 
                 Q ${cx + 16} ${cy - (innerR + outerR) / 2} ${cx} ${cy - outerR} 
                 Q ${cx - 16} ${cy - (innerR + outerR) / 2} ${cx} ${cy - innerR} Z"
                fill="${i % 2 === 0 ? 'rgba(240,205,170,0.5)' : 'rgba(215,170,125,0.4)'}"
                stroke="rgba(200,150,100,0.3)" stroke-width="0.5"
                transform="rotate(${a} ${cx} ${cy})"/>`;
        }

        const svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">
            <circle cx="${cx}" cy="${cy}" r="${outerR + 8}" fill="rgba(232,190,150,0.15)"/>
            ${petals}
            <circle cx="${cx}" cy="${cy}" r="${innerR - 4}" fill="rgba(240,205,170,0.35)" stroke="rgba(200,150,100,0.3)" stroke-width="1"/>
        </svg>`;

        document.getElementById('woodCarving').innerHTML = svg;
    })();
</script>
</body>
</html>
