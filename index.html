<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Bottle - Perfect Circle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 414px;
            height: 896px;
            background: #231205 url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-size: cover;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border-radius: 24px;
            overflow: hidden;
            color: #fff;
        }

        /* Header Navigation */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 600;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px 10px 14px;
        }

        .heart-badge {
            background: linear-gradient(180deg, #ff4e3a, #d62000);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .stat-item {
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Table Playing Area */
        .table-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Siz chizgan ko'k aylana joyi */
        .blue-circle-guide {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            border: 2px dashed rgba(53, 110, 243, 0.4);
            position: absolute;
            pointer-events: none;
        }

        .bottle {
            width: 42px;
            height: 125px;
            background: radial-gradient(circle at 30% 30%, #32ad4a, #0f4d1a);
            border-radius: 20px 20px 8px 8px;
            position: absolute;
            transform: rotate(50deg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 2;
        }

        /* Players Container */
        .players-circle {
            width: 300px;
            height: 300px;
            position: relative;
        }

        .player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            margin-left: -25px;
            border-radius: 14px;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid #ff2a8d;
        }

        /* AYLANA BO'YLAB 12 TA ANIQ TENG KOORDINATA (R = 135px) */
        .p-aziza     { transform: translate(0px, -135px); }       /* 0deg */
        .p-malika    { transform: translate(68px, -117px); }     /* 30deg */
        .p-sevinch   { transform: translate(117px, -68px); }      /* 60deg */
        .p-gulnoza   { transform: translate(135px, 0px); }        /* 90deg */
        .p-nilufar   { transform: translate(117px, 68px); }       /* 120deg */
        .p-fazliddin { transform: translate(68px, 117px); }       /* 150deg */
        .p-dildora   { transform: translate(0px, 135px); }        /* 180deg */
        .p-sardor    { transform: translate(-68px, 117px); }      /* 210deg */
        .p-madina2   { transform: translate(-117px, 68px); }      /* 240deg */
        .p-jasur     { transform: translate(-135px, 0px); }       /* 270deg */
        .p-madina1   { transform: translate(-117px, -68px); }     /* 300deg */
        .p-bekzod    { transform: translate(-68px, -117px); }     /* 330deg */

        .player.pink { border-color: #ff33a8; box-shadow: 0 0 10px #ff33a8; }
        .player.blue { border-color: #00bfff; box-shadow: 0 0 10px #00bfff; }
        .player.gold { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }

        .player-name {
            position: absolute;
            bottom: -18px;
            font-size: 10px;
            font-weight: 700;
            text-shadow: 0 1px 3px #000, 0 0 2px #000;
            white-space: nowrap;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            font-size: 9px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 1px solid #fff;
            z-index: 4;
        }

        /* Chat Section */
        .chat-section {
            background: #ffffff;
            color: #111;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            height: 320px;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-size: cover;
            flex-shrink: 0;
        }

        .chat-username { font-weight: 700; font-size: 11px; color: #333; }
        .chat-bubble {
            background: #f1f2f6;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background: #f1f2f6;
            border: 1px solid #e1e2e6;
            padding: 10px 14px;
            border-radius: 20px;
            outline: none;
            font-size: 12px;
        }

        .send-btn {
            background: #0d0d0d;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-nav">
        <span>✕</span>
        <div>Spin the Bottle 🍾❤️</div>
        <span>⋮</span>
    </div>

    <div class="stats-bar">
        <div class="heart-badge">❤️ 143</div>
        <div class="stat-item">🎟️ 8 d.</div>
        <div class="stat-item">🎯 #5</div>
        <div class="stat-item">⚙️</div>
        <div class="stat-item">Table 229 🔄</div>
    </div>

    <div class="table-area">
        <div class="blue-circle-guide"></div>
        <div class="bottle"></div>

        <div class="players-circle">
            <div class="player p-aziza gold" style="background-image: url('https://i.pravatar.cc/150?img=1');"><span class="badge">4</span><span class="player-name">Aziza</span></div>
            <div class="player p-malika pink" style="background-image: url('https://i.pravatar.cc/150?img=2');"><span class="badge">2</span><span class="player-name">Malika 👑</span></div>
            <div class="player p-sevinch pink" style="background-image: url('https://i.pravatar.cc/150?img=3');"><span class="badge">1</span><span class="player-name">Sevinch</span></div>
            <div class="player p-gulnoza pink" style="background-image: url('https://i.pravatar.cc/150?img=4');"><span class="badge">1</span><span class="player-name">Gulnoza</span></div>
            <div class="player p-nilufar pink" style="background-image: url('https://i.pravatar.cc/150?img=5');"><span class="badge">5</span><span class="player-name">Nilufar</span></div>
            <div class="player p-fazliddin blue" style="background-image: url('https://i.pravatar.cc/150?img=6');"><span class="badge">5</span><span class="player-name">Fazliddin</span></div>
            <div class="player p-dildora pink" style="background-image: url('https://i.pravatar.cc/150?img=7');"><span class="badge">5</span><span class="player-name">Dildora</span></div>
            <div class="player p-sardor blue" style="background-image: url('https://i.pravatar.cc/150?img=8');"><span class="badge">1</span><span class="player-name">Sardor ✔</span></div>
            <div class="player p-madina2 gold" style="background-image: url('https://i.pravatar.cc/150?img=9');"><span class="badge">1</span><span class="player-name">Madina</span></div>
            <div class="player p-jasur blue" style="background-image: url('https://i.pravatar.cc/150?img=10');"><span class="badge">1</span><span class="player-name">Jasur ✔</span></div>
            <div class="player p-madina1 pink" style="background-image: url('https://i.pravatar.cc/150?img=11');"><span class="badge">1</span><span class="player-name">Madina</span></div>
            <div class="player p-bekzod blue" style="background-image: url('https://i.pravatar.cc/150?img=12');"><span class="badge">1</span><span class="player-name">Bekzod ✔</span></div>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">
            <span>💬 Chat</span>
            <span style="font-size: 12px; color: #666;">👥 12/12</span>
        </div>
        <div class="chat-messages">
            <div class="chat-item">
                <div class="chat-avatar" style="background-image: url('https://i.pravatar.cc/150?img=1');"></div>
                <div>
                    <div class="chat-username">Aziza 👑</div>
                    <div class="chat-bubble">Salom hammaga! 👋</div>
                </div>
            </div>
            <div class="chat-item">
                <div class="chat-avatar" style="background-image: url('https://i.pravatar.cc/150?img=12');"></div>
                <div>
                    <div class="chat-username">Bekzod ✔</div>
                    <div class="chat-bubble">O'yin boshlaymizmi? 🔥</div>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" placeholder="Xabar yozing...">
            <button class="send-btn">➤</button>
        </div>
    </div>
</div>

</body>
</html>
