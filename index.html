<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <!-- ================= STOL ================= -->
    <div class="table-area">

      <div class="table">

        <!-- Markaz -->
        <div class="center">

          <div class="ornament">
            <div class="ornament-line"></div>

            <span class="orn top">✦</span>
            <span class="orn right">✦</span>
            <span class="orn bottom">✦</span>
            <span class="orn left">✦</span>
          </div>

          <!-- Butilka -->
          <button id="bottle" class="bottle">
            🍾
          </button>

        </div>

        <!-- O'yinchilar -->

        <div class="player player-top" data-player="0">
          <span>O‘yinchi 1</span>
        </div>

        <div class="player player-right" data-player="1">
          <span>O‘yinchi 2</span>
        </div>

        <div class="player player-bottom" data-player="2">
          <span>O‘yinchi 3</span>
        </div>

        <div class="player player-left" data-player="3">
          <span>O‘yinchi 4</span>
        </div>

        <!-- Taymer -->
        <div id="timer" class="timer">
          5
        </div>

      </div>

    </div>


    <!-- ================= CHAT ================= -->

    <div class="chat-area">

      <div class="chat-header">
        <strong>Chat</strong>

        <span id="turnText">
          Navbat: O‘yinchi 1
        </span>
      </div>

      <div id="messages" class="messages">

        <div class="system-message">
          O‘yin boshlandi. Navbat O‘yinchi 1 da.
        </div>

      </div>

      <div class="chat-input">

        <input
          id="messageInput"
          type="text"
          placeholder="Xabar yozing..."
        >

        <button id="sendButton">
          ➤
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
