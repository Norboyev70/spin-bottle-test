<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spin Battle</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:white;
 background:radial-gradient(circle at top,#303b70,#090b18 65%);
 display:flex;
 justify-content:center;
}
.game{
 width:100%;
 max-width:500px;
 padding:20px;
 text-align:center;
}
h1{
 margin:10px 0 5px;
 font-size:36px;
}
.sub{
 color:#bfc5ff;
 margin-bottom:20px;
}
.players{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-bottom:20px;
}
.player{
 background:#171b35;
 border:1px solid #343b70;
 border-radius:14px;
 padding:12px;
}
.player b{
 display:block;
 font-size:18px;
}
.score{
 color:#ffd84d;
 margin-top:5px;
}
.arena{
 position:relative;
 width:min(85vw,360px);
 height:min(85vw,360px);
 margin:20px auto;
 border-radius:50%;
 background:radial-gradient(circle,#252d58,#11152c);
 border:10px solid #4c5bc4;
 box-shadow:0 0 35px #0008,0 0 25px #5365ff55;
 display:flex;
 align-items:center;
 justify-content:center;
}
.bottle{
 width:190px;
 height:55px;
 position:relative;
 transform-origin:center;
 transition:transform 4s cubic-bezier(.12,.7,.12,1);
}
.body{
 position:absolute;
 left:30px;
 top:10px;
 width:125px;
 height:35px;
 border-radius:10px 25px 25px 10px;
 background:linear-gradient(90deg,#42d9ff,#5b6cff);
 box-shadow:inset 0 3px 8px #fff7;
}
.neck{
 position:absolute;
 right:10px;
 top:18px;
 width:35px;
 height:19px;
 background:#64e4ff;
 border-radius:4px 8px 8px 4px;
}
.cap{
 position:absolute;
 right:0;
 top:15px;
 width:12px;
 height:25px;
 background:#e9faff;
 border-radius:3px;
}
.spin{
 border:0;
 width:90%;
 padding:16px;
 border-radius:14px;
 font-size:20px;
 font-weight:bold;
 color:#111;
 background:#ffd84d;
 cursor:pointer;
 box-shadow:0 6px 0 #bd9200;
}
.spin:active{
 transform:translateY(5px);
 box-shadow:0 1px 0 #bd9200;
}
.spin:disabled{
 opacity:.5;
}
.result{
 min-height:45px;
 margin-top:18px;
 padding:12px;
 border-radius:12px;
 background:#171b35;
 font-size:18px;
}
.add{
 margin-top:15px;
 padding:10px 18px;
 border:1px solid #5965a8;
 border-radius:10px;
 background:#171b35;
 color:white;
}
</style>
</head>

<body>

<div class="game">
<h1>🍾 SPIN BATTLE</h1>
<div class="sub">Shishani aylantir va raqibni tanla!</div>

<div class="players" id="players"></div>

<div class="arena">
  <div class="bottle" id="bottle">
    <div class="body"></div>
    <div class="neck"></div>
    <div class="cap"></div>
  </div>
</div>

<button class="spin" id="spin">AYLANTIR 🔥</button>

<div class="result" id="result">
 O‘yin boshlash uchun tugmani bosing.
</div>

<button class="add" onclick="addPlayer()">+ O‘yinchi qo‘shish</button>
</div>

<script>
let players=[
 {name:"Player 1",score:0},
 {name:"Player 2",score:0},
 {name:"Player 3",score:0},
 {name:"Player 4",score:0}
];

let rotation=0;
let spinning=false;

const bottle=document.getElementById("bottle");
const spinBtn=document.getElementById("spin");
const result=document.getElementById("result");
const playersBox=document.getElementById("players");

function renderPlayers(){
 playersBox.innerHTML="";
 players.forEach((p,i)=>{
   playersBox.innerHTML+=`
   <div class="player">
     <b>👤 ${p.name}</b>
     <div class="score">⭐ ${p.score}</div>
   </div>`;
 });
}

function spin(){
 if(spinning) return;

 spinning=true;
 spinBtn.disabled=true;

 const extra=1440+Math.floor(Math.random()*1440);
 rotation+=extra;

 bottle.style.transform=`rotate(${rotation}deg)`;

 result.textContent="🍾 Aylanmoqda...";

 setTimeout(()=>{
   const winner=Math.floor(Math.random()*players.length);

   players[winner].score+=10;

   result.innerHTML=
   `🔥 <b>${players[winner].name}</b> tanlandi! +10 ochko`;

   renderPlayers();

   spinning=false;
   spinBtn.disabled=false;
 },4000);
}

function addPlayer(){
 if(players.length>=8){
   alert("Maksimal 8 ta o‘yinchi!");
   return;
 }

 const name=prompt("O‘yinchi nomi:");
 if(name && name.trim()){
   players.push({
     name:name.trim(),
     score:0
   });
   renderPlayers();
 }
}

spinBtn.addEventListener("click",spin);

renderPlayers();
</script>

</body>
  </html>
