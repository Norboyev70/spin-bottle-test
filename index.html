<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin the Bottle - Classic Wood Table</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;
}
body{
    background:#0d0805;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.game-container{
    width:100%;
    max-width:414px;
    height:100vh;
    max-height:896px;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(180,115,60,.4) 0%,
            rgba(110,60,25,.3) 40%,
            rgba(40,20,8,.8) 80%,
            rgba(15,8,3,.95) 100%
        ),
        repeating-linear-gradient(
            8deg,
            rgba(0,0,0,.08) 0px,
            rgba(0,0,0,.08) 2px,
            transparent 2px,
            transparent 12px
        ),
        repeating-linear-gradient(
            172deg,
            rgba(255,200,140,.04) 0px,
            rgba(255,200,140,.04) 1px,
            transparent 1px,
            transparent 16px
        ),
        linear-gradient(
            150deg,
            #aa6c38 0%,
            #8c5225 30%,
            #6e3b15 60%,
            #4a240a 85%,
            #2a1203 100%
        );
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    border-radius:32px;
    color:#fff;
    border:1px solid rgba(255,190,120,.25);
    box-shadow:
        0 25px 55px rgba(0,0,0,.85),
        inset 0 0 80px rgba(0,0,0,.6);
}
.game-container::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(255,225,180,.15),
            transparent 50%
        );
    pointer-events:none;
    z-index:0;
}
.header-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px 10px;
    font-size:16px;
    font-weight:600;
    color:#f5e0c8;
    background:rgba(20,10,4,.35);
    backdrop-filter:blur(6px);
    position:relative;
    z-index:10;
    border-bottom:1px solid rgba(255,200,140,.12);
}
.header-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:15px;
    font-weight:800;
    color:#fcecdb;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.stats-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px 12px;
    background:rgba(10,5,2,.2);
    position:relative;
    z-index:10;
}
.heart-badge{
    background:linear-gradient(135deg, #ef5350, #c62828);
    padding:5px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:12px;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.25);
}
.stat-item{
    font-size:11px;
    font-weight:700;
    color:#fcecdb;
    background:rgba(0,0,0,.3);
    padding:5px 10px;
    border-radius:12px;
    border:1px solid rgba(255,200,140,.15);
    box-shadow:inset 0 1px rgba(255,255,255,.1);
}
.table-area{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}
.rope-medallion{
    width:220px;
    height:220px;
    position:absolute;
    pointer-events:none;
}

/* SHISHA POZITSIYASI VA MARKAZLASHTIRISH */
.bottle{
    width:28px;
    height:90px;
    position:absolute;
    left:calc(50% - 14px);
    top:calc(50% - 45px);
    transform-origin:50% 50%;
    transform:rotate(0deg);
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));
    z-index:20;
    transition:transform 3s cubic-bezier(.15,.85,.15,1);
    cursor:pointer;
}

.spin-label{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:14px;
    font-weight:800;
    letter-spacing:3px;
    color:rgba(255,220,180,.12);
    pointer-events:none;
    z-index:4;
}
.players-container{
    width:350px;
    height:350px;
    position:relative;
    z-index:10;
}
.player{
    position:absolute;
    width:56px;
    height:56px;
    border-radius:18px;
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    box-shadow:0 6px 14px rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.45);
    z-index:10;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.player.pink{ border-color:#ff4081; box-shadow:0 0 10px rgba(255,64,129,.35); }
.player.blue{ border-color:#00bcd4; box-shadow:0 0 10px rgba(0,188,212,.35); }
.player.gold{ border-color:#d79b00; box-shadow:0 0 10px rgba(215,155,0,.35); }
.player.winner{
    animation: winnerPulse 1s ease-in-out infinite;
    box-shadow:
        0 0 0 4px rgba(255,215,0,.75),
        0 0 25px rgba(255,215,0,.9);
    z-index: 25;
}
@keyframes winnerPulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}
.player-name{
    position:absolute;
    bottom:-19px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    white-space:nowrap;
    max-width:80px;
    overflow:hidden;
    text-overflow:ellipsis;
    z-index:15;
}
.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    background:linear-gradient(135deg, #ff9800, #ed6c02);
    color:#fff;
    font-size:9.5px;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:800;
    border:1.5px solid #3d210b;
    box-shadow:0 2px 4px rgba(0,0,0,.5);
    z-index:20;
}
.chat-section{
    background:#ffffff;
    color:#111;
    border-top-left-radius:28px;
    border-top-right-radius:28px;
    height:290px;
    display:flex;
    flex-direction:column;
    padding:16px 18px;
    box-shadow:0 -10px 30px rgba(0,0,0,.6);
    border-top:1px solid rgba(0,0,0,.08);
    z-index:30;
}
.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.08);
    font-weight:600;
    font-size:13px;
    color:rgba(0,0,0,.7);
}
.chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px 0;
}
.chat-item{ display:flex; align-items:flex-start; gap:10px; }
.chat-avatar{
    width:32px;
    height:32px;
    border-radius:10px;
    background-size:cover;
    flex-shrink:0;
}
.chat-username{
    font-weight:700;
    font-size:11px;
    color:rgba(0,0,0,.55);
    margin-bottom:2px;
}
.chat-bubble{
    background:rgba(0,0,0,.04);
    padding:8px 12px;
    border-radius:4px 14px 14px 14px;
    font-size:12px;
    color:#111;
    border:1px solid rgba(0,0,0,.06);
    line-height:1.3;
}
.chat-input-area{ display:flex; align-items:center; gap:10px; padding-top:8px; }
.chat-input{
    flex:1;
    background:rgba(0,0,0,.04);
    border:1px solid rgba(0,0,0,.12);
    padding:10px 16px;
    border-radius:20px;
    outline:none;
    font-size:12px;
    color:#111;
}
.chat-input::placeholder{ color:rgba(0,0,0,.35); }
.send-btn{
    background:linear-gradient(135deg, #2b2b2b, #000);
    color:#fff;
    border:none;
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}
@media (max-width: 380px) {
    .game-container{ border-radius:0; }
    .rope-medallion{ width:190px; height:190px; }
    .players-container{ width:310px; height:310px; }
    .player{ width:52px; height:52px; }
}
</style>
</head>
<body>

<div class="game-container">
    <div class="header-nav">
        <span style="cursor:pointer;" onclick="closeGame()">✕</span>
        <div class="header-title">
            Spin the Bottle 🍾
        </div>
        <span style="cursor:pointer;">⋮</span>
    </div>

    <div class="stats-bar">
        <div class="heart-badge">
            ❤️ 10,000
        </div>
        <div class="stat-item">
            🎟️ 8 d.
        </div>
        <div class="stat-item">
            🎯 #
        </div>
        <div class="stat-item">
            ⚙️
        </div>
        <div class="stat-item">
            Table 229 🔄
        </div>
    </div>

    <div class="table-area">
        <svg class="rope-medallion" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="medFill" cx="50%" cy="45%" r="60%">
                    <stop offset="0%" stop-color="rgba(255,210,160,.18)"/>
                    <stop offset="70%" stop-color="rgba(120,60,20,.12)"/>
                    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
                </radialGradient>
            </defs>
            <circle cx="120" cy="120" r="112" fill="url(#medFill)"/>
            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="5"/>
            <circle cx="120" cy="120" r="92" fill="none" stroke="rgba(255,200,140,.20)" stroke-width="1.5"/>
            <circle cx="120" cy="120" r="46" fill="rgba(0,0,0,.12)" stroke="rgba(255,200,140,.25)" stroke-width="1"/>
        </svg>

        <div class="spin-label">UZB</div>

        <!-- SHISHA SVG -->
        <svg
            class="bottle"
            id="bottle"
            onclick="spinBottle()"
            viewBox="0 0 100 320"
            xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"  stop-color="#010d05"/>
                    <stop offset="12%" stop-color="#062b0e"/>
                    <stop offset="25%" stop-color="#0f521b"/>
                    <stop offset="42%" stop-color="#2ebd43"/>
                    <stop offset="50%" stop-color="#8bf59a"/>
                    <stop offset="58%" stop-color="#2ebd43"/>
                    <stop offset="75%" stop-color="#0f521b"/>
                    <stop offset="88%" stop-color="#062b0e"/>
                    <stop offset="100%" stop-color="#010d05"/>
                </linearGradient>
                <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"  stop-color="#111"/>
                    <stop offset="50%" stop-color="#444"/>
                    <stop offset="100%" stop-color="#000"/>
                </linearGradient>
            </defs>

            <path
                fill="url(#glassGrad)"
                fill-opacity="0.96"
                d="M38,0 L62,0 L62,16 Q63,18 63,22 L63,90 Q63,112 78,126 Q94,140 94,166 L94,292 Q94,308 79,312 Q65,316 50,316 Q35,316 21,312 Q6,308 6,292 L6,166 Q6,140 22,126 Q37,112 37,90 L37,22 Q37,18 38,16 Z"
            />
            <rect x="37" y="0" width="26" height="8" rx="2" fill="url(#capGrad)"/>
            <ellipse cx="32" cy="185" rx="5" ry="65" fill="rgba(255,255,255,0.45)" opacity="0.6"/>
            <path d="M25,60 L25,295" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
            <path d="M80,130 Q88,200 86,296" stroke="rgba(0,0,0,0.4)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
            <path
                fill="none"
                stroke="rgba(0,0,0,0.4)"
                stroke-width="2"
                d="M38,0 L62,0 L62,16 Q63,18 63,22 L63,90 Q63,112 78,126 Q94,140 94,166 L94,292 Q94,308 79,312 Q65,316 50,316 Q35,316 21,312 Q6,308 6,292 L6,166 Q6,140 22,126 Q37,112 37,90 L37,22 Q37,18 38,16 Z"
            />
        </svg>

        <div class="players-container" id="playersContainer"></div>
    </div>

    <div class="chat-section">
        <div class="chat-header">
            <span>💬 O'yin chati</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=1');"></div>
                <div>
                    <div class="chat-username">Aziza 👑</div>
                    <div class="chat-bubble">Salom hammaga! 👋</div>
                </div>
            </div>
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=12');"></div>
                <div>
                    <div class="chat-username">Bekzod ✔</div>
                    <div class="chat-bubble">O'yinni boshlaymizmi? 🔥</div>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input
                id="chatInput"
                type="text"
                class="chat-input"
                placeholder="Xabar yozing..."
                onkeydown="if(event.key==='Enter') sendMessage();"
            >
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
const players = [
    { name:"Aziza", img:"https://i.pravatar.cc/150?img=1", badge:4, type:"gold" },
    { name:"Malika 👑", img:"https://i.pravatar.cc/150?img=2", badge:2, type:"pink" },
    { name:"Sevinchbekova", img:"https://i.pravatar.cc/150?img=3", badge:1, type:"pink" },
    { name:"Gulnoza", img:"https://i.pravatar.cc/150?img=4", badge:1, type:"pink" },
    { name:"Nilufar", img:"https://i.pravatar.cc/150?img=5", badge:5, type:"pink" },
    { name:"Fazliddin", img:"https://i.pravatar.cc/150?img=6", badge:5, type:"blue" },
    { name:"Dildora", img:"https://i.pravatar.cc/150?img=7", badge:5, type:"pink" },
    { name:"Sardorbek ✔", img:"https://i.pravatar.cc/150?img=8", badge:1, type:"blue" },
    { name:"Madina", img:"https://i.pravatar.cc/150?img=9", badge:1, type:"gold" },
    { name:"Jasurbek ✔", img:"https://i.pravatar.cc/150?img=10", badge:1, type:"blue" },
    { name:"Madina", img:"https://i.pravatar.cc/150?img=11", badge:1, type:"pink" },
    { name:"Bekzod ✔", img:"https://i.pravatar.cc/150?img=12", badge:1, type:"blue" }
];

function renderPlayers(){
    const container = document.getElementById("playersContainer");
    if(!container) return;
    container.innerHTML="";
    
    const total = players.length;
    const radius = 140; 
    const centerOffset = 175 - 28; 

    players.forEach((player, index) => {
        const angleDeg = (index * (360 / total)) - 90; 
        const angleRad = angleDeg * (Math.PI / 180);

        const x = centerOffset + radius * Math.cos(angleRad);
        const y = centerOffset + radius * Math.sin(angleRad);

        const playerEl = document.createElement("div");
        playerEl.className = `player ${player.type}`;
        playerEl.style.backgroundImage = `url('${player.img}')`;
        playerEl.style.left = `${x}px`;
        playerEl.style.top = `${y}px`;

        playerEl.innerHTML = `
            <span class="badge">${player.badge}</span>
            <span class="player-name" title="${player.name}">${player.name}</span>
        `;
        
        let normalizedAngle = ((angleDeg % 360) + 360) % 360;
        playerEl.dataset.angle = normalizedAngle.toFixed(2);
        container.appendChild(playerEl);
    });
}

let currentRotation = 0;
let isSpinning = false;

function spinBottle(){
    if(isSpinning) return;
    isSpinning = true;
    const bottle = document.getElementById("bottle");
    
    document.querySelectorAll(".player.winner").forEach(el => el.classList.remove("winner"));

    const extraDegrees = Math.floor(Math.random() * 360) + 1440;
    currentRotation += extraDegrees;
    bottle.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        isSpinning = false;
        
        const neckAngle = ((currentRotation - 90) % 360 + 360) % 360;
        let closestEl = null;
        let closestDiff = 361;

        document.querySelectorAll(".player").forEach(el => {
            const a = parseFloat(el.dataset.angle);
            let diff = Math.abs(a - neckAngle);
            if (diff > 180) diff = 360 - diff;
            if (diff < closestDiff) {
                closestDiff = diff;
                closestEl = el;
            }
        });

        if (closestEl) {
            closestEl.classList.add("winner");
        }
    }, 3100);
}

function sendMessage(){
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if(!text) return;

    const chatMessages = document.getElementById("chatMessages");
    const item = document.createElement("div");
    item.className = "chat-item";
    item.innerHTML = `
        <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=33');"></div>
        <div>
            <div class="chat-username" style="color:#2e7d32;">Siz</div>
            <div class="chat-bubble">${text}</div>
        </div>
    `;
    chatMessages.appendChild(item);
    input.value = "";
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function closeGame(){
    alert("O'yindan chiqilmoqda...");
}

document.addEventListener("DOMContentLoaded", () => {
    renderPlayers();
});
</script>

</body>
</html>
