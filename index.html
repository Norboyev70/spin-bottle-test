<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spin the Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- O'YIN QISMI -->
    <section class="game-area">

      <div class="top-bar">
        <div class="room-name">
          <span class="room-dot"></span>
          Stol #001
        </div>

        <div class="players-count">
          <span id="playerCount">0</span>/12
        </div>
      </div>

      <div class="table-wrap">

        <div class="table">

          <div class="table-decoration decoration-1"></div>
          <div class="table-decoration decoration-2"></div>
          <div class="table-decoration decoration-3"></div>
          <div class="table-decoration decoration-4"></div>

          <!-- MARKAZ -->
          <div class="table-center">

            <div class="center-pattern"></div>

            <div
              id="bottle"
              class="bottle"
              title="Butilkani aylantirish"
            >
              <div class="bottle-neck"></div>
              <div class="bottle-body">
                <div class="bottle-shine"></div>
              </div>
            </div>

          </div>

          <!-- O'YINCHILAR -->
          <div class="seat seat-1">
            <div class="player empty" data-seat="0">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-2">
            <div class="player empty" data-seat="1">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-3">
            <div class="player empty" data-seat="2">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-4">
            <div class="player empty" data-seat="3">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-5">
            <div class="player empty" data-seat="4">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-6">
            <div class="player empty" data-seat="5">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-7">
            <div class="player empty" data-seat="6">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-8">
            <div class="player empty" data-seat="7">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-9">
            <div class="player empty" data-seat="8">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-10">
            <div class="player empty" data-seat="9">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-11">
            <div class="player empty" data-seat="10">
              <div class="avatar">+</div>
            </div>
          </div>

          <div class="seat seat-12">
            <div class="player empty" data-seat="11">
              <div class="avatar">+</div>
            </div>
          </div>

        </div>

      </div>

    </section>


    <!-- CHAT -->
    <section class="chat-area">

      <div class="chat-header">
        <div>
          <strong>Chat</strong>
          <span class="online-dot"></span>
        </div>

        <span class="chat-info">Stol suhbati</span>
      </div>

      <div id="messages" class="messages">

        <div class="system-message">
          Stolga xush kelibsiz 👋
        </div>

      </div>

      <div class="quick-messages">
        <button data-message="Salom 👋">Salom 👋</button>
        <button data-message="Omad 😏">Omad 😏</button>
        <button data-message="Aylantir 🔥">Aylantir 🔥</button>
        <button data-message="😂">😂</button>
      </div>

      <form id="chatForm" class="chat-input">

        <input
          id="messageInput"
          type="text"
          maxlength="100"
          placeholder="Xabar yozing..."
          autocomplete="off"
        >

        <button type="submit">
          ➤
        </button>

      </form>

    </section>

  </main>

  <div id="resultPopup" class="result-popup">
    <div class="result-card">
      <div class="result-title">Butilka tanladi</div>
      <div id="resultName" class="result-name">—</div>
      <button id="closeResult">Davom etish</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
