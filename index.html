<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Spin the Bottle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= TOP BAR ================= -->
    <header class="topbar">

        <div class="profile">
            <div class="profile-avatar">
                <img src="https://i.pravatar.cc/100?img=12" alt="Avatar">
            </div>

            <div class="profile-info">
                <strong>Norbek</strong>
                <span>Level 18</span>
            </div>
        </div>

        <div class="currency">
            <div class="heart-icon">♥</div>
            <strong>11 250</strong>
        </div>

    </header>


    <!-- ================= GAME AREA ================= -->
    <main class="game-area">

        <section class="table-section">

            <!-- TABLE -->
            <div class="game-table">

                <!-- DECORATION -->
                <div class="table-decoration decoration-1"></div>
                <div class="table-decoration decoration-2"></div>
                <div class="table-decoration decoration-3"></div>
                <div class="table-decoration decoration-4"></div>


                <!-- ================= PLAYER 1 ================= -->
                <div class="player player-1">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=32" alt="">
                    </div>
                    <span class="player-name">Madina</span>
                    <span class="kiss-count">♥ 128</span>
                </div>


                <!-- ================= PLAYER 2 ================= -->
                <div class="player player-2">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=14" alt="">
                    </div>
                    <span class="player-name">Jasur</span>
                    <span class="kiss-count">♥ 96</span>
                </div>


                <!-- ================= PLAYER 3 ================= -->
                <div class="player player-3">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=47" alt="">
                    </div>
                    <span class="player-name">Malika</span>
                    <span class="kiss-count">♥ 214</span>
                </div>


                <!-- ================= PLAYER 4 ================= -->
                <div class="player player-4">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=11" alt="">
                    </div>
                    <span class="player-name">Bekzod</span>
                    <span class="kiss-count">♥ 74</span>
                </div>


                <!-- ================= PLAYER 5 ================= -->
                <div class="player player-5">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=44" alt="">
                    </div>
                    <span class="player-name">Sevinch</span>
                    <span class="kiss-count">♥ 183</span>
                </div>


                <!-- ================= PLAYER 6 ================= -->
                <div class="player player-6">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=13" alt="">
                    </div>
                    <span class="player-name">Aziz</span>
                    <span class="kiss-count">♥ 61</span>
                </div>


                <!-- ================= PLAYER 7 ================= -->
                <div class="player player-7">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=49" alt="">
                    </div>
                    <span class="player-name">Shahnoza</span>
                    <span class="kiss-count">♥ 302</span>
                </div>


                <!-- ================= PLAYER 8 ================= -->
                <div class="player player-8">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=8" alt="">
                    </div>
                    <span class="player-name">Sardor</span>
                    <span class="kiss-count">♥ 119</span>
                </div>


                <!-- ================= PLAYER 9 ================= -->
                <div class="player player-9">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=25" alt="">
                    </div>
                    <span class="player-name">Zarina</span>
                    <span class="kiss-count">♥ 246</span>
                </div>


                <!-- ================= PLAYER 10 ================= -->
                <div class="player player-10">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=3" alt="">
                    </div>
                    <span class="player-name">Diyor</span>
                    <span class="kiss-count">♥ 88</span>
                </div>


                <!-- ================= PLAYER 11 ================= -->
                <div class="player player-11">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=45" alt="">
                    </div>
                    <span class="player-name">Rayhona</span>
                    <span class="kiss-count">♥ 156</span>
                </div>


                <!-- ================= PLAYER 12 ================= -->
                <div class="player player-12">
                    <div class="player-avatar">
                        <img src="https://i.pravatar.cc/100?img=6" alt="">
                    </div>
                    <span class="player-name">Kamron</span>
                    <span class="kiss-count">♥ 105</span>
                </div>


                <!-- ================= BOTTLE ================= -->
                <button class="bottle-button" id="bottleButton">

                    <div class="bottle-wrapper">

                        <div class="bottle">
                            <div class="bottle-neck"></div>
                            <div class="bottle-body"></div>
                            <div class="bottle-highlight"></div>
                        </div>

                    </div>

                </button>

            </div>

        </section>


        <!-- ================= CHAT ================= -->
        <section class="chat-section">

            <div class="chat-header">

                <div>
                    <strong>Stol suhbati</strong>
                    <span>12 o‘yinchi</span>
                </div>

                <button class="chat-more">•••</button>

            </div>


            <div class="messages" id="messages">

                <div class="message">
                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=32" alt="">
                    </div>

                    <div class="message-content">
                        <strong>Madina</strong>
                        <p>Salom hammaga ❤️</p>
                    </div>
                </div>


                <div class="message own">
                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=12" alt="">
                    </div>

                    <div class="message-content">
                        <strong>Norbek</strong>
                        <p>Qani boshladik 😎</p>
                    </div>
                </div>


                <div class="message">
                    <div class="message-avatar">
                        <img src="https://i.pravatar.cc/60?img=14" alt="">
                    </div>

                    <div class="message-content">
                        <strong>Jasur</strong>
                        <p>Kimga tusharkin? 😂</p>
                    </div>
                </div>

            </div>


            <!-- QUICK MESSAGES -->
            <div class="quick-messages">

                <button data-message="❤️">❤️</button>
                <button data-message="😂">😂</button>
                <button data-message="🔥">🔥</button>
                <button data-message="😍">😍</button>
                <button data-message="Voy!">Voy!</button>

            </div>


            <!-- MESSAGE INPUT -->
            <div class="chat-input">

                <button class="emoji-button">☺</button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Xabar yozing..."
                    autocomplete="off"
                >

                <button class="send-button" id="sendButton">
                    ➤
                </button>

            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->
    <nav class="bottom-nav">

        <button class="nav-item active">
            <span>🎮</span>
            <small>O‘yin</small>
        </button>

        <button class="nav-item">
            <span>🏆</span>
            <small>Reyting</small>
        </button>

        <button class="nav-item">
            <span>♥</span>
            <small>Yuraklar</small>
        </button>

        <button class="nav-item">
            <span>👤</span>
            <small>Profil</small>
        </button>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
