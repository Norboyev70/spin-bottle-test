<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Bottle Game Test</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: white; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 5px; }
        #log { margin-top: 20px; text-align: left; display: inline-block; background: #1e1e1e; padding: 15px; border-radius: 5px; width: 400px; height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🍾 Butilka O'yini (Test)</h1>
    <p>Foydalanuvchi ID: <span id="uid"></span></p>
    <button onclick="spinBottle()">Butilkani aylantirish</button>
    <br><br>
    <h3>O'yin tarixi (Log):</h3>
    <div id="log"></div>

    <script>
        const userId = "User_" + Math.floor(Math.random() * 1000);
        document.getElementById("uid").innerText = userId;

        const ws = new WebSocket(`ws://127.0.0.1:8000/ws/game/${userId}`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += `<p><b>${data.event}:</b> ${JSON.stringify(data)}</p>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        function spinBottle() {
            ws.send(JSON.stringify({ action: "spin_bottle" }));
        }
    </script>
</body>
</html>
