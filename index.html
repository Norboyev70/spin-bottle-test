<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin the Bottle - Global Edition</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;
}
body{
    background:#120c08;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game-container{
    width:100%;
    max-width:414px;
    height:100vh;
    max-height:896px;
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,220,166,.35) 0%,
            rgba(222,172,111,.18) 38%,
            rgba(151,91,45,.08) 65%,
            transparent 88%
        ),
        repeating-linear-gradient(
            7deg,
            rgba(91,49,20,.04) 0px,
            rgba(91,49,20,.04) 2px,
            transparent 2px,
            transparent 14px
        ),
        linear-gradient(
            145deg,
            #c8965c 0%,
            #b27a43 28%,
            #a36833 55%,
            #875126 78%,
            #613615 100%
        );
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    border-radius:32px;
    color:#fff;
    border:1px solid rgba(255,220,170,.25);
    box-shadow:0 25px 55px rgba(0,0,0,.75);
}

.header-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px 10px;
    font-size:16px;
    font-weight:600;
    color:#e0c3a8;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(8px);
    position:relative;
    z-index:10;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:15px;
    font-weight:700;
    color:#f5e5d3;
    letter-spacing:0.5px;
}

.stats-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px 12px;
    background:rgba(0,0,0,.15);
    position:relative;
    z-index:10;
}

.heart-badge{
    background:linear-gradient(135deg, #bd3a3a, #8f2424);
    padding:5px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:12px;
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
}

.stat-item{
    font-size:11px;
    font-weight:600;
    color:#d9c0a7;
    background:rgba(255,255,255,.08);
    padding:5px 10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
}

.table-area{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

/* DINAMIK YORITISH EFFEKTI */
.rope-medallion{
    width:230px;
    height:230px;
    position:absolute;
    pointer-events:none;
    transition: filter 0.5s ease;
}

.table-area.spinning .rope-medallion {
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
}

.bottle{
    width:34px;
    height:109px;
    position:absolute;
    left:calc(50% - 17px);
    top:calc(50% - 54.5px);
    transform-origin:50% 50%;
    transform:rotate(0deg);
    filter:drop-shadow(0 12px 18px rgba(0,0,0,.6));
    z-index:20;
    transition:transform 3.2s cubic-bezier(.1,.85,.15,1), filter 0.3s ease;
    cursor:pointer;
}

/* MIKRO-INTERAKSIYA: BOSHGARILISHDAGI MAYIN SILJISH */
.bottle:active {
    transform: scale(0.97);
}

.players-container{
    width:340px;
    height:340px;
    position:relative;
    z-index:10;
}

.player{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    border:2.5px solid #d4af37;
    z-index:10;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    cursor:pointer;
}

.player:active {
    transform: scale(0.92) !important;
}

/* G'OLIB BO'LGANDA ELEGANT RANG O'ZGARISHI */
.player.winner{
    animation: winnerGlow 1.2s ease-in-out infinite alternate;
    z-index:25;
}

@keyframes winnerGlow{
    0% { box-shadow: 0 0 0 2px #fff, 0 0 15px #d4af37; }
    100% { box-shadow: 0 0 0 5px #fff, 0 0 30px #d4af37; }
}

.player-name-box {
    position:absolute;
    bottom:-20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:3px;
    background:rgba(18, 12, 8, 0.85);
    padding:2px 6px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
    z-index:15;
}

.player-flag {
    font-size:10px;
}

.player-name{
    font-size:9.5px;
    font-weight:600;
    color:#e5d5c5;
    max-width:60px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-section{
    background:#1a1410;
    color:#fff;
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    height:280px;
    display:flex;
    flex-direction:column;
    padding:16px 18px;
    border-top:1px solid rgba(255,255,255,.08);
    z-index:30;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-weight:600;
    font-size:12px;
    color:rgba(255,255,255,.5);
    letter-spacing:0.5px;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px 0;
}

.chat-item{ display:flex; align-items:flex-start; gap:10px; }

.chat-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    background-size:cover;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,.2);
}

.chat-username{
    font-weight:600;
    font-size:11px;
    color:rgba(255,255,255,.5);
    margin-bottom:2px;
}

.chat-bubble{
    background:rgba(255,255,255,.05);
    padding:8px 12px;
    border-radius:4px 12px 12px 12px;
    font-size:12px;
    color:#e5d5c5;
    border:1px solid rgba(255,255,255,.05);
    line-height:1.3;
}

.chat-input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding-top:8px;
}

.chat-input{
    flex:1;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:20px;
    outline:none;
    font-size:12px;
    color:#fff;
}

.chat-input::placeholder{ color:rgba(255,255,255,.3); }

.send-btn{
    background:#c8965c;
    color:#120c08;
    border:none;
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
    transition:transform 0.1s ease;
}

.send-btn:active {
    transform: scale(0.9);
}
</style>
</head>

<body>

<div class="game-container">

    <div class="header-nav">
        <span style="cursor:pointer;">✕</span>
        <div class="header-title">Spin the Bottle</div>
        <span style="cursor:pointer;">⋮</span>
    </div>

    <div class="stats-bar">
        <div class="heart-badge">❤️ 10,000</div>
        <div class="stat-item">🎟️ 8</div>
        <div class="stat-item">GLOBAL #229</div>
    </div>

    <div class="table-area" id="tableArea">
        <svg class="rope-medallion" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="4"/>
            <circle cx="120" cy="120" r="46" fill="rgba(255,235,198,.08)" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
        </svg>

        <svg class="bottle" id="bottle" onclick="spinBottle()" viewBox="0 0 100 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#021508"/>
                    <stop offset="25%" stop-color="#0f5c1e"/>
                    <stop offset="50%" stop-color="#6bd675"/>
                    <stop offset="75%" stop-color="#0f5c1e"/>
                    <stop offset="100%" stop-color="#021508"/>
                </linearGradient>

                <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#bda069"/>
                    <stop offset="50%" stop-color="#fff8e7"/>
                    <stop offset="100%" stop-color="#bda069"/>
                </linearGradient>
            </defs>

            <path fill="url(#glassGrad)" fill-opacity="0.95" d="M32,0 L68,0 L68,14 Q69,16 69,20 L69,64 Q69,86 82,100 Q96,116 96,140 L96,292 Q96,306 79,310 Q65,314 50,314 Q35,314 21,310 Q4,306 4,292 L4,140 Q4,116 18,100 Q31,86 31,64 L31,20 Q31,16 32,14 Z" />
            
            <rect x="14" y="150" width="72" height="135" rx="4" fill="url(#labelGrad)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
            
            <text x="50" y="205" text-anchor="middle" font-size="10" font-weight="900" fill="#2d1c07" letter-spacing="1">SPIN THE</text>
            <text x="50" y="228" text-anchor="middle" font-size="12" font-weight="900" fill="#2d1c07" letter-spacing="1.2">BOTTLE</text>
            
            <ellipse cx="26" cy="60" rx="4" ry="30" fill="rgba(255,255,255,0.3)"/>
        </svg>

        <div class="players-container" id="playersContainer"></div>
    </div>

    <div class="chat-section">
        <div class="chat-header">GLOBAL CHAT</div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=1');"></div>
                <div>
                    <div class="chat-username">Elena 🇺🇸</div>
                    <div class="chat-bubble">Hello everyone! 👋</div>
                </div>
            </div>
            <div class="chat-item">
                <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=12');"></div>
                <div>
                    <div class="chat-username">Lucas 🇩🇪</div>
                    <div class="chat-bubble">Ready for the spin? 🔥</div>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input id="chatInput" type="text" class="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage();">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

</div>

<script>
// XALQARO FOYDALANUVCHILAR VA BAYROQLAR
const players = [
    { name:"Aziza", flag:"🇺🇿", img:"https://i.pravatar.cc/150?img=3" },
    { name:"Elena", flag:"🇺🇸", img:"https://i.pravatar.cc/150?img=1" },
    { name:"Lucas", flag:"🇩🇪", img:"https://i.pravatar.cc/150?img=12" },
    { name:"Sora", flag:"🇯🇵", img:"https://i.pravatar.cc/150?img=5" },
    { name:"Mateo", flag:"🇪🇸", img:"https://i.pravatar.cc/150?img=6" },
    { name:"Chloe", flag:"🇫🇷", img:"https://i.pravatar.cc/150?img=9" },
    { name:"Ali", flag:"🇦🇪", img:"https://i.pravatar.cc/150?img=11" },
    { name:"Anna", flag:"🇬🇧", img:"https://i.pravatar.cc/150?img=16" }
];

function renderPlayers(){
    const container = document.getElementById("playersContainer");
    if(!container) return;
    container.innerHTML = "";

    const total = players.length;
    const containerWidth = container.offsetWidth || 340;
    const avatarSize = 52;
    const radius = (containerWidth / 2) - (avatarSize / 2) - 5; 
    const center = containerWidth / 2;

    players.forEach((player, index) => {
        const angleDeg = (index * (360 / total)) - 90; 
        const angleRad = angleDeg * (Math.PI / 180);

        const x = center + radius * Math.cos(angleRad) - (avatarSize / 2);
        const y = center + radius * Math.sin(angleRad) - (avatarSize / 2);

        const playerEl = document.createElement("div");
        playerEl.className = "player";
        playerEl.style.backgroundImage = `url('${player.img}')`;
        playerEl.style.left = `${x}px`;
        playerEl.style.top = `${y}px`;

        playerEl.innerHTML = `
            <div class="player-name-box">
                <span class="player-flag">${player.flag}</span>
                <span class="player-name">${player.name}</span>
            </div>
        `;

        let normalizedAngle = ((angleDeg % 360) + 360) % 360;
        playerEl.dataset.angle = normalizedAngle.toFixed(2);
        container.appendChild(playerEl);
    });
}

let currentRotation = 0;
let isSpinning = false;

function spinBottle(){
    if(isSpinning) return;
    isSpinning = true;

    const bottle = document.getElementById("bottle");
    const tableArea = document.getElementById("tableArea");
    
    // Yoritish effektini yoqish
    tableArea.classList.add("spinning");
    document.querySelectorAll(".player.winner").forEach(el => el.classList.remove("winner"));

    const extraDegrees = Math.floor(Math.random() * 360) + 1440;
    currentRotation += extraDegrees;

    bottle.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        isSpinning = false;
        tableArea.classList.remove("spinning");

        const neckAngle = (((currentRotation - 90) % 360) + 360) % 360;

        let closestEl = null;
        let closestDiff = 361;

        document.querySelectorAll(".player").forEach(el => {
            const a = parseFloat(el.dataset.angle);
            let diff = Math.abs(a - neckAngle);
            if (diff > 180) diff = 360 - diff;
            if (diff < closestDiff) {
                closestDiff = diff;
                closestEl = el;
            }
        });

        if (closestEl) {
            closestEl.classList.add("winner");
        }
    }, 3200);
}

function sendMessage(){
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if(!text) return;

    const messages = document.getElementById("chatMessages");
    const item = document.createElement("div");
    item.className = "chat-item";

    const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    item.innerHTML = `
        <div class="chat-avatar" style="background-image:url('https://i.pravatar.cc/150?img=13');"></div>
        <div>
            <div class="chat-username" style="color:#c8965c;">You 🇺🇿</div>
            <div class="chat-bubble">${safeText}</div>
        </div>
    `;

    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    input.value = "";
}

document.addEventListener("DOMContentLoaded", () => {
    renderPlayers();
});
</script>

</body>
</html>
