<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

  <header>
    <div class="title">SPIN THE BOTTLE</div>
    <button id="addBtn">＋</button>
  </header>

  <main>

    <div class="game-area">

      <div id="table">

        <div id="bottle">
          🍾
        </div>

        <button id="spinBtn">
          AYLANtirish
        </button>

        <div id="players"></div>

      </div>

    </div>

    <div class="chat">

      <div class="chat-title">
        CHAT
      </div>

      <div id="messages">
        <div class="message">
          O'yinchilarni qo'shing va butilkani aylantiring!
        </div>
      </div>

      <form id="chatForm">
        <input
          id="chatInput"
          type="text"
          placeholder="Xabar yozing..."
          autocomplete="off"
        >

        <button type="submit">➤</button>
      </form>

    </div>

  </main>

</div>


<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2>O'yinchi qo'shish</h2>

    <input
      id="nameInput"
      maxlength="16"
      placeholder="O'yinchi ismi"
    >

    <div class="buttons">

      <button id="cancelBtn">
        Bekor qilish
      </button>

      <button id="saveBtn">
        Qo'shish
      </button>

    </div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
